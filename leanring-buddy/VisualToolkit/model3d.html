<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  3D model overlay page (loaded by Model3DOverlay.swift).
  Claude streams one JSON command per line (parts, arrays, cutaways, labels,
  focus...). Each command is parsed with JSON.parse and built with three.js
  primitives; nothing from the model is ever evaluated as code, and all label
  text is inserted as text nodes. The two placeholders below are filled in by
  Swift with the bundled three.js source and the handwriting font.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:">
<style>
@font-face { font-family: HandwritingFont; src: url(data:font/woff2;base64,__HANDWRITING_FONT_BASE64__) format("woff2"); }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; -webkit-user-select: none; user-select: none; }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; }
#stage.is-dragging { cursor: grabbing; }
#annotation-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.callout-tag {
  position: absolute; left: 0; top: 0; pointer-events: none; white-space: nowrap;
  font-family: HandwritingFont, "Chalkboard SE", "Marker Felt", sans-serif; font-size: 21px; line-height: 1;
  color: #262626; padding: 8px 12px 7px 15px; border-radius: 3px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), 0 3px 10px rgba(0, 0, 0, 0.08);
}
.callout-tag::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; border-radius: 3px 0 0 3px; background: var(--stripe-color); }
.callout-tag .callout-text { display: inline-block; clip-path: inset(-30% 100% -30% 0); }
#pen-cursor {
  position: absolute; left: 0; top: 0; width: 17px; height: 17px; pointer-events: none; opacity: 0;
  transition: opacity 0.25s ease; filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.35)) drop-shadow(0 2px 5px rgba(120, 80, 0, 0.25));
}
#close-button {
  position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 11px; border: none; padding: 0;
  background: rgba(30, 30, 30, 0.78); color: #f4f1e8; font: 600 13px -apple-system, sans-serif; line-height: 22px;
  cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.18s ease, background 0.15s ease;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
}
#close-button.is-visible { opacity: 1; pointer-events: auto; }
#close-button:hover { background: rgba(214, 72, 64, 0.95); }
</style>
<script>/*__THREE_JS_SOURCE__*/</script>
</head>
<body>
<canvas id="stage"></canvas>
<svg id="annotation-layer"></svg>
<div id="tag-layer"></div>
<svg id="pen-cursor" viewBox="0 0 16 16"><!--__PEN_TRIANGLE_SVG_PATH__--></svg>
<button id="close-button" title="Close">&#x2715;</button>
<script>
'use strict';

// ---------------------------------------------------------------------------
// Constants and palettes
// ---------------------------------------------------------------------------

// Sampled from Clicky's tags (fill, left stripe).
const CALLOUT_COLORS = {
  yellow: { fill: '#fbf7c7', stripe: '#e8ce55' },
  green: { fill: '#e0fae3', stripe: '#6ee491' },
  blue: { fill: '#dfe9fb', stripe: '#7ba2e3' },
  pink: { fill: '#f6d5e8', stripe: '#de6dac' },
};
const CALLOUT_COLOR_ORDER = ['yellow', 'green', 'blue', 'pink'];

// Material presets so Claude can say "steel" or "pcb" instead of tuning
// numbers. Matte on purpose: the look is a flat-shaded illustration, so
// metals are light grays with a little sheen, not chrome.
const MATERIAL_PRESETS = {
  plastic: { color: '#d9d6cf', roughness: 0.6, metalness: 0 },
  paint: { color: '#92989b', roughness: 0.6, metalness: 0.1 },
  steel: { color: '#b4b9bd', roughness: 0.6, metalness: 0.2 },
  aluminum: { color: '#c4c8cc', roughness: 0.6, metalness: 0.15 },
  darkmetal: { color: '#5d6267', roughness: 0.65, metalness: 0.2 },
  titanium: { color: '#8f949b', roughness: 0.6, metalness: 0.2 },
  copper: { color: '#c47a4c', roughness: 0.5, metalness: 0.35 },
  brass: { color: '#b8913f', roughness: 0.5, metalness: 0.35 },
  bronze: { color: '#7a6650', roughness: 0.6, metalness: 0.3 },
  gold: { color: '#d6ad48', roughness: 0.45, metalness: 0.4 },
  pcb: { color: '#3f9a5c', roughness: 0.8, metalness: 0 },
  // Cool blue-gray for the inside of machines (ducts, bays, inner casings),
  // so a cutaway reads as "inside" against the painted shell.
  interior: { color: '#8a9cb0', roughness: 0.6, metalness: 0.15 },
  // The near-black void behind the insides of a cut-open body.
  cavity: { color: '#1e2124', roughness: 0.95, metalness: 0 },
  chip: { color: '#55585e', roughness: 0.6, metalness: 0.05 },
  rubber: { color: '#2b2b2b', roughness: 0.92, metalness: 0 },
  ceramic: { color: '#f1efe9', roughness: 0.6, metalness: 0 },
  glass: { color: '#d8ecf4', roughness: 0.1, metalness: 0, opacity: 0.28 },
  glow: { color: '#ff9a3c', roughness: 0.5, metalness: 0, emissive: 1.6 },
  tissue: { color: '#e79a92', roughness: 0.55, metalness: 0 },
  bone: { color: '#efe6d2', roughness: 0.65, metalness: 0 },
  wood: { color: '#b98a5a', roughness: 0.75, metalness: 0 },
  concrete: { color: '#bdbab2', roughness: 0.9, metalness: 0 },
};

// Flow arrow colors: air, hot exhaust, and a neutral force.
const ARROW_COLORS = { air: '#6aa3ad', hot: '#a8743a', force: '#8e9398' };

const OUTLINE_WIDTH_IN_PIXELS = 2;
// Tiny parts (pins, pads) get a thinner line so they don't turn into black blobs.
const SMALL_PART_OUTLINE_WIDTH_IN_PIXELS = 1.2;
// The outline and leader colors follow the page behind the overlay: a dark
// line on light pages, a white one on dark pages ({"t":"anchor","backdrop":"dark"}).
const BACKDROP_STYLES = {
  light: { outline: 0x1d1f22, leader: '#1b1b1b', halo: '#ffffff' },
  dark: { outline: 0xf4f4f2, leader: '#f6f6f4', halo: '#121212' },
};
let currentBackdropStyle = BACKDROP_STYLES.light;
const LABEL_ROW_MARGIN_IN_PIXELS = 100;
const CAMERA_FIELD_OF_VIEW_IN_DEGREES = 28;

// ---------------------------------------------------------------------------
// Renderer, scene, lights
// ---------------------------------------------------------------------------

const stageCanvas = document.getElementById('stage');
const annotationLayer = document.getElementById('annotation-layer');
const tagLayer = document.getElementById('tag-layer');
const penCursorElement = document.getElementById('pen-cursor');
const closeButtonElement = document.getElementById('close-button');

const renderer = new THREE.WebGLRenderer({
  canvas: stageCanvas, alpha: true, premultipliedAlpha: true, antialias: true, stencil: true,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.localClippingEnabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CAMERA_FIELD_OF_VIEW_IN_DEGREES, 1, 0.01, 10000);

// modelRoot carries the view rotation (azimuth, idle sway, user drag);
// modelContent is shifted so the model's center sits on the rotation pivot.
const modelRoot = new THREE.Group();
const modelContent = new THREE.Group();
modelRoot.add(modelContent);
scene.add(modelRoot);

// Key light from the upper front-left over a high ambient, so top faces
// read lighter than sides and light grays stay gray.
scene.add(new THREE.HemisphereLight(0xffffff, 0x8f8a80, 0.95));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
keyLight.position.set(-4, 8, 6);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0xfff3e2, 0.35);
fillLight.position.set(6, 2.5, 4);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
rimLight.position.set(0, 4, -8);
scene.add(rimLight);

// A tiny procedural "photo studio" reflected by metals (a soft box above,
// two side panels), so steel and brass don't render black.
function buildStudioEnvironmentTexture() {
  const environmentScene = new THREE.Scene();
  const roomMesh = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 10), new THREE.MeshBasicMaterial({ color: 0x7a7874, side: THREE.BackSide }));
  environmentScene.add(roomMesh);
  const addLightPanel = (panelWidth, panelHeight, panelPosition, brightness) => {
    const panelMaterial = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide });
    panelMaterial.color.setRGB(brightness, brightness, brightness);
    const panelMesh = new THREE.Mesh(new THREE.PlaneGeometry(panelWidth, panelHeight), panelMaterial);
    panelMesh.position.set(panelPosition[0], panelPosition[1], panelPosition[2]);
    panelMesh.lookAt(0, 0, 0);
    environmentScene.add(panelMesh);
  };
  addLightPanel(6, 3, [0, 4.9, 0], 3.2);
  addLightPanel(3, 4, [-4.9, 1, 1], 2.2);
  addLightPanel(3, 4, [4.9, 1, -1], 1.6);
  addLightPanel(6, 1.2, [0, -1, 4.9], 1.1);
  const environmentGenerator = new THREE.PMREMGenerator(renderer);
  const environmentTexture = environmentGenerator.fromScene(environmentScene, 0.04).texture;
  environmentGenerator.dispose();
  return environmentTexture;
}
scene.environment = buildStudioEnvironmentTexture();

// ---------------------------------------------------------------------------
// Small helpers
// ---------------------------------------------------------------------------

function finiteNumberOr(value, fallbackValue) {
  const parsedNumber = Number(value);
  return Number.isFinite(parsedNumber) ? parsedNumber : fallbackValue;
}

function vector3Or(value, fallbackArray) {
  if (!Array.isArray(value)) return fallbackArray.slice();
  return [0, 1, 2].map((componentIndex) => finiteNumberOr(value[componentIndex], fallbackArray[componentIndex]));
}

function pointListOrNull(value) {
  if (!Array.isArray(value)) return null;
  const pointList = value
    .filter((point) => Array.isArray(point) && point.length >= 2)
    .map((point) => new THREE.Vector2(finiteNumberOr(point[0], 0), finiteNumberOr(point[1], 0)));
  return pointList.length >= 2 ? pointList : null;
}

function degreesToRadians(degrees) {
  return finiteNumberOr(degrees, 0) * Math.PI / 180;
}

function safeColor(colorValue, fallbackColor) {
  const resolvedColor = new THREE.Color(fallbackColor);
  if (typeof colorValue === 'string' && /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(colorValue.trim())) {
    resolvedColor.set(colorValue.trim());
  } else if (typeof colorValue === 'string' && /^[a-z]{3,20}$/i.test(colorValue.trim())) {
    // CSS color names; three.js leaves the color unchanged for unknown names.
    const namedColor = colorValue.trim().toLowerCase();
    if (THREE.Color.NAMES && Object.prototype.hasOwnProperty.call(THREE.Color.NAMES, namedColor)) resolvedColor.set(namedColor);
  }
  return resolvedColor;
}

function easeOutCubic(progress) { return 1 - Math.pow(1 - progress, 3); }
function easeInOutCubic(progress) { return progress < 0.5 ? 4 * progress * progress * progress : 1 - Math.pow(-2 * progress + 2, 3) / 2; }
function easeOutBack(progress) { const overshoot = 1.5; return 1 + (overshoot + 1) * Math.pow(progress - 1, 3) + overshoot * Math.pow(progress - 1, 2); }

// Tweens run inside the render loop so they stay in sync with the frames.
const activeTweens = new Set();
let animationSpeedMultiplier = 1;
function animateOverDuration(durationInMilliseconds, onProgress) {
  const scaledDuration = Math.max(16, durationInMilliseconds / animationSpeedMultiplier);
  return new Promise((resolve) => {
    activeTweens.add({ startTime: performance.now(), duration: scaledDuration, onProgress, resolve });
  });
}
function waitMilliseconds(durationInMilliseconds) {
  return animateOverDuration(durationInMilliseconds, () => {});
}
function advanceTweens(now) {
  for (const tween of Array.from(activeTweens)) {
    const progress = Math.min(1, (now - tween.startTime) / tween.duration);
    tween.onProgress(progress);
    if (progress >= 1) { activeTweens.delete(tween); tween.resolve(); }
  }
}

// ---------------------------------------------------------------------------
// Geometry builders (all centered on their own origin)
// ---------------------------------------------------------------------------

// A box whose every edge is rounded with radius cornerRadius. Built from a
// segmented box: each vertex is pulled onto the surface of an inner box
// "inflated" by the radius, and its normal is the inflation direction, so
// the shading is perfectly smooth across the rounded edges.
function buildRoundedBoxGeometry(boxWidth, boxHeight, boxDepth, cornerRadius, cornerSegmentCount = 4) {
  const halfExtents = [boxWidth / 2, boxHeight / 2, boxDepth / 2];
  const clampedRadius = Math.max(0, Math.min(cornerRadius, ...halfExtents.map((halfExtent) => halfExtent * 0.98)));
  if (clampedRadius < 1e-6) return new THREE.BoxGeometry(boxWidth, boxHeight, boxDepth);

  const segmentsPerAxis = cornerSegmentCount * 2 + 1;
  const geometry = new THREE.BoxGeometry(2, 2, 2, segmentsPerAxis, segmentsPerAxis, segmentsPerAxis);
  const positionAttribute = geometry.attributes.position;
  const normalAttribute = geometry.attributes.normal;
  const vertexPosition = new THREE.Vector3();
  const innerPoint = new THREE.Vector3();
  const inflationDirection = new THREE.Vector3();

  // Grid index 0..cornerSegmentCount spans the rounded band on the negative
  // side, the middle segment is the flat face, and the rest the positive band.
  const remapGridCoordinate = (unitCoordinate, halfExtent) => {
    const gridIndex = Math.round((unitCoordinate + 1) / 2 * segmentsPerAxis);
    if (gridIndex <= cornerSegmentCount) return -halfExtent + clampedRadius * (gridIndex / cornerSegmentCount);
    return halfExtent - clampedRadius + clampedRadius * ((gridIndex - cornerSegmentCount - 1) / cornerSegmentCount);
  };

  for (let vertexIndex = 0; vertexIndex < positionAttribute.count; vertexIndex++) {
    vertexPosition.fromBufferAttribute(positionAttribute, vertexIndex);
    vertexPosition.set(
      remapGridCoordinate(vertexPosition.x, halfExtents[0]),
      remapGridCoordinate(vertexPosition.y, halfExtents[1]),
      remapGridCoordinate(vertexPosition.z, halfExtents[2]),
    );
    innerPoint.set(
      THREE.MathUtils.clamp(vertexPosition.x, -halfExtents[0] + clampedRadius, halfExtents[0] - clampedRadius),
      THREE.MathUtils.clamp(vertexPosition.y, -halfExtents[1] + clampedRadius, halfExtents[1] - clampedRadius),
      THREE.MathUtils.clamp(vertexPosition.z, -halfExtents[2] + clampedRadius, halfExtents[2] - clampedRadius),
    );
    inflationDirection.subVectors(vertexPosition, innerPoint);
    if (inflationDirection.lengthSq() < 1e-12) inflationDirection.fromBufferAttribute(normalAttribute, vertexIndex);
    inflationDirection.normalize();
    vertexPosition.copy(innerPoint).addScaledVector(inflationDirection, clampedRadius);
    positionAttribute.setXYZ(vertexIndex, vertexPosition.x, vertexPosition.y, vertexPosition.z);
    normalAttribute.setXYZ(vertexIndex, inflationDirection.x, inflationDirection.y, inflationDirection.z);
  }
  positionAttribute.needsUpdate = true;
  normalAttribute.needsUpdate = true;
  return geometry;
}

// Turns a y-axis primitive so its main axis points along x, y or z.
function orientGeometryAlongAxis(geometry, axisName) {
  if (axisName === 'x') geometry.rotateZ(-Math.PI / 2);
  else if (axisName === 'z') geometry.rotateX(Math.PI / 2);
  return geometry;
}

function buildPartGeometry(partSpec) {
  const shapeName = String(partSpec.shape || 'box');
  const radius = Math.max(0.0001, finiteNumberOr(partSpec.r, 0.5));
  const height = Math.max(0.0001, finiteNumberOr(partSpec.h, 1));
  const axisName = partSpec.axis === 'x' || partSpec.axis === 'z' ? partSpec.axis : 'y';

  switch (shapeName) {
    case 'cylinder': {
      const topRadius = Math.max(0, finiteNumberOr(partSpec.rTop, radius));
      return orientGeometryAlongAxis(new THREE.CylinderGeometry(topRadius, radius, height, 48, 1), axisName);
    }
    case 'cone': {
      const topRadius = Math.max(0, finiteNumberOr(partSpec.rTop, 0));
      return orientGeometryAlongAxis(new THREE.CylinderGeometry(topRadius, radius, height, 48, 1), axisName);
    }
    case 'tube': {
      // A hollow cylinder (casing, pipe, ring) as a closed lathe profile.
      const innerRadius = THREE.MathUtils.clamp(finiteNumberOr(partSpec.inner, radius * 0.85), 0.0001, radius * 0.995);
      const innerTopRadius = THREE.MathUtils.clamp(finiteNumberOr(partSpec.innerTop, innerRadius), 0.0001, Math.max(0.0002, finiteNumberOr(partSpec.rTop, radius) * 0.995));
      const outerTopRadius = Math.max(innerTopRadius * 1.005, finiteNumberOr(partSpec.rTop, radius));
      const tubeProfile = [
        new THREE.Vector2(innerRadius, -height / 2), new THREE.Vector2(radius, -height / 2),
        new THREE.Vector2(outerTopRadius, height / 2), new THREE.Vector2(innerTopRadius, height / 2),
        new THREE.Vector2(innerRadius, -height / 2),
      ];
      return orientGeometryAlongAxis(new THREE.LatheGeometry(tubeProfile, 64), axisName);
    }
    case 'sphere':
      return new THREE.SphereGeometry(radius, 40, 24);
    case 'torus':
      return orientGeometryAlongAxis(
        new THREE.TorusGeometry(radius, Math.max(0.0001, finiteNumberOr(partSpec.tube, radius * 0.2)), 20, 64).rotateX(Math.PI / 2),
        axisName,
      );
    case 'capsule':
      return orientGeometryAlongAxis(new THREE.CapsuleGeometry(radius, height, 8, 24), axisName);
    case 'extrude': {
      // A 2D outline in the x-y plane pushed out along z by "depth". The
      // bevel is taken out of the outline and depth, so the finished part is
      // exactly the size given (three.js adds it on the outside otherwise).
      const outlinePoints = pointListOrNull(partSpec.points);
      if (!outlinePoints || outlinePoints.length < 3) return new THREE.BoxGeometry(1, 1, 1);
      const extrusionDepth = Math.max(0.0001, finiteNumberOr(partSpec.depth, 1));
      const bevelSize = THREE.MathUtils.clamp(finiteNumberOr(partSpec.bevel, 0), 0, extrusionDepth * 0.45);
      const cornerRounding = Math.max(0, finiteNumberOr(partSpec.round, 0));
      const shellThickness = finiteNumberOr(partSpec.shell, 0);
      let extrudedGeometry;
      if (shellThickness > 0) {
        extrudedGeometry = buildExtrudedShellGeometry(outlinePoints, extrusionDepth, bevelSize, shellThickness);
      } else {
        const outlineShape = buildRoundedShape(bevelSize > 0 ? insetPolygon(outlinePoints, bevelSize) : outlinePoints, Math.max(0, cornerRounding - bevelSize));
        // Holes grow by the bevel so they finish at their given size too.
        // Their corners are rounded like the outline's ("holeRound", default
        // 3/4 of "round"): a sharp hole inside a rounded outline (a phone
        // frame) pokes through the corners and the hole vanishes.
        const holeCornerRounding = Math.max(0, finiteNumberOr(partSpec.holeRound, cornerRounding * 0.75));
        (Array.isArray(partSpec.holes) ? partSpec.holes : []).slice(0, 24).forEach((holeValue) => {
          const holePoints = pointListOrNull(holeValue);
          if (holePoints && holePoints.length >= 3) {
            outlineShape.holes.push(buildRoundedShape(bevelSize > 0 ? insetPolygon(holePoints, -bevelSize) : holePoints, holeCornerRounding, THREE.Path));
          }
        });
        (Array.isArray(partSpec.circles) ? partSpec.circles : []).slice(0, 48).forEach((circleValue) => {
          if (!Array.isArray(circleValue) || circleValue.length < 3) return;
          const circleRadius = Math.max(0.0001, finiteNumberOr(circleValue[2], 1) + bevelSize);
          const holePath = new THREE.Path();
          holePath.absarc(finiteNumberOr(circleValue[0], 0), finiteNumberOr(circleValue[1], 0), circleRadius, 0, Math.PI * 2, true);
          outlineShape.holes.push(holePath);
        });
        extrudedGeometry = new THREE.ExtrudeGeometry(outlineShape, {
          depth: Math.max(0.0001, extrusionDepth - 2 * bevelSize), bevelEnabled: bevelSize > 0,
          bevelSize, bevelThickness: bevelSize, bevelOffset: 0, bevelSegments: 3, curveSegments: 16,
        });
        extrudedGeometry.translate(0, 0, bevelSize);
      }
      extrudedGeometry.translate(0, 0, -extrusionDepth / 2);
      // "axis" is the extrusion direction here (default z).
      if (partSpec.axis === 'y') extrudedGeometry.rotateX(-Math.PI / 2);
      else if (partSpec.axis === 'x') extrudedGeometry.rotateY(Math.PI / 2);
      return extrudedGeometry;
    }
    case 'lathe': {
      // A profile of [radius, y] points spun around the y axis (nozzles, bottles, domes).
      const profilePoints = pointListOrNull(partSpec.points);
      if (!profilePoints) return new THREE.SphereGeometry(radius, 24, 16);
      profilePoints.forEach((profilePoint) => { profilePoint.x = Math.max(0, profilePoint.x); });
      // "shell" turns the profile into a hollow skin of that thickness (a
      // fuselage, a bottle wall) so a cutaway shows what is inside.
      const shellThickness = finiteNumberOr(partSpec.shell, 0);
      if (shellThickness > 0) {
        const innerProfile = profilePoints.slice().reverse()
          .map((profilePoint) => new THREE.Vector2(Math.max(0.0001, profilePoint.x - shellThickness), profilePoint.y));
        profilePoints.push(...innerProfile, profilePoints[0].clone());
      }
      return orientGeometryAlongAxis(new THREE.LatheGeometry(profilePoints, 64), axisName);
    }
    case 'loft':
      return orientLoftAlongAxis(buildLoftGeometry(partSpec), axisName === 'y' && partSpec.axis !== 'y' ? 'x' : axisName);
    case 'cable': {
      const cableCurve = curveFromPathPoints(partSpec.path);
      if (!cableCurve) return new THREE.SphereGeometry(radius, 12, 8);
      return new THREE.TubeGeometry(cableCurve, 64, radius, 12, false);
    }
    case 'ribbon': {
      const ribbonCurve = curveFromPathPoints(partSpec.path);
      if (!ribbonCurve) return new THREE.BoxGeometry(1, 1, 1);
      return buildRibbonGeometry(
        ribbonCurve,
        Math.max(0.0001, finiteNumberOr(partSpec.width, 1)),
        Math.max(0.0001, finiteNumberOr(partSpec.thickness, 0.2)),
        new THREE.Vector3(...vector3Or(partSpec.up, [0, 0, 1])),
      );
    }
    case 'box':
    default: {
      const [boxWidth, boxHeight, boxDepth] = vector3Or(partSpec.size, [1, 1, 1]).map((extent) => Math.max(0.0001, Math.abs(extent)));
      // A small machined edge by default; big round pillows look like toys.
      const smallestSide = Math.min(boxWidth, boxHeight, boxDepth);
      const cornerRadius = THREE.MathUtils.clamp(finiteNumberOr(partSpec.radius, smallestSide * 0.06), 0, smallestSide * 0.5);
      return buildRoundedBoxGeometry(boxWidth, boxHeight, boxDepth, cornerRadius, partSpec.chamfer ? 1 : 4);
    }
  }
}

// An outline polygon with every corner rounded off by up to "cornerRadius"
// (never more than half of either neighbouring edge).
function buildRoundedShape(outlinePoints, cornerRadius, ShapeClass = THREE.Shape) {
  if (!(cornerRadius > 0)) return new ShapeClass(outlinePoints);
  const roundedShape = new ShapeClass();
  const pointCount = outlinePoints.length;
  outlinePoints.forEach((cornerPoint, pointIndex) => {
    const previousPoint = outlinePoints[(pointIndex - 1 + pointCount) % pointCount];
    const nextPoint = outlinePoints[(pointIndex + 1) % pointCount];
    const towardPrevious = previousPoint.clone().sub(cornerPoint);
    const towardNext = nextPoint.clone().sub(cornerPoint);
    const trimLength = Math.min(cornerRadius, towardPrevious.length() / 2, towardNext.length() / 2);
    const curveStart = cornerPoint.clone().addScaledVector(towardPrevious.normalize(), trimLength);
    const curveEnd = cornerPoint.clone().addScaledVector(towardNext.normalize(), trimLength);
    if (pointIndex === 0) roundedShape.moveTo(curveStart.x, curveStart.y);
    else roundedShape.lineTo(curveStart.x, curveStart.y);
    roundedShape.quadraticCurveTo(cornerPoint.x, cornerPoint.y, curveEnd.x, curveEnd.y);
  });
  // No closePath: the outline closes itself, and the repeated first point
  // closePath adds made a zero-length edge that broke beveled holes.
  return roundedShape;
}

// A smooth 3D curve through [[x,y,z],...] (straight when only two points).
function curveFromPathPoints(pathValue) {
  if (!Array.isArray(pathValue)) return null;
  const pathPoints = pathValue
    .filter((point) => Array.isArray(point) && point.length >= 3)
    .slice(0, 40)
    .map((point) => new THREE.Vector3(...vector3Or(point, [0, 0, 0])));
  if (pathPoints.length < 2) return null;
  if (pathPoints.length === 2) return new THREE.LineCurve3(pathPoints[0], pathPoints[1]);
  return new THREE.CatmullRomCurve3(pathPoints, false, 'centripetal');
}

// A flat strip (ribbon cable, belt, strap) swept along a curve. Its width
// lies across the curve, perpendicular to "upVector" where it can.
function buildRibbonGeometry(ribbonCurve, ribbonWidth, ribbonThickness, upVector) {
  const sampleCount = 64;
  const frenetFrames = ribbonCurve.computeFrenetFrames(sampleCount, false);
  const crossSections = [];
  for (let sampleIndex = 0; sampleIndex <= sampleCount; sampleIndex++) {
    const sampleProgress = sampleIndex / sampleCount;
    const centerPoint = ribbonCurve.getPointAt(sampleProgress);
    const tangent = ribbonCurve.getTangentAt(sampleProgress).normalize();
    let widthDirection = new THREE.Vector3().crossVectors(tangent, upVector);
    if (widthDirection.lengthSq() < 1e-6) widthDirection.copy(frenetFrames.binormals[sampleIndex]);
    widthDirection.normalize();
    const thicknessDirection = new THREE.Vector3().crossVectors(widthDirection, tangent).normalize();
    const halfWidth = widthDirection.multiplyScalar(ribbonWidth / 2);
    const halfThickness = thicknessDirection.multiplyScalar(ribbonThickness / 2);
    crossSections.push([
      centerPoint.clone().add(halfWidth).add(halfThickness),
      centerPoint.clone().sub(halfWidth).add(halfThickness),
      centerPoint.clone().sub(halfWidth).sub(halfThickness),
      centerPoint.clone().add(halfWidth).sub(halfThickness),
    ]);
  }
  const positions = [];
  const pushTriangle = (firstPoint, secondPoint, thirdPoint) => positions.push(...firstPoint.toArray(), ...secondPoint.toArray(), ...thirdPoint.toArray());
  for (let sampleIndex = 0; sampleIndex < sampleCount; sampleIndex++) {
    const currentSection = crossSections[sampleIndex];
    const nextSection = crossSections[sampleIndex + 1];
    for (let cornerIndex = 0; cornerIndex < 4; cornerIndex++) {
      const nextCornerIndex = (cornerIndex + 1) % 4;
      pushTriangle(currentSection[cornerIndex], nextSection[cornerIndex], nextSection[nextCornerIndex]);
      pushTriangle(currentSection[cornerIndex], nextSection[nextCornerIndex], currentSection[nextCornerIndex]);
    }
  }
  const [startSection, endSection] = [crossSections[0], crossSections[sampleCount]];
  pushTriangle(startSection[0], startSection[2], startSection[1]);
  pushTriangle(startSection[0], startSection[3], startSection[2]);
  pushTriangle(endSection[0], endSection[1], endSection[2]);
  pushTriangle(endSection[0], endSection[2], endSection[3]);
  const ribbonGeometry = new THREE.BufferGeometry();
  ribbonGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  ribbonGeometry.computeVertexNormals();
  return ribbonGeometry;
}

// Catmull-Rom through evenly spaced samples, so section sizes change smoothly.
function catmullRomScalar(previousValue, startValue, endValue, nextValue, progress) {
  const progressSquared = progress * progress;
  const progressCubed = progressSquared * progress;
  return 0.5 * ((2 * startValue) + (-previousValue + endValue) * progress
    + (2 * previousValue - 5 * startValue + 4 * endValue - nextValue) * progressSquared
    + (-previousValue + 3 * startValue - 3 * endValue + nextValue) * progressCubed);
}

// A body lofted through cross-sections along x (fuselage, car body, mouse,
// bottle): each section is a rounded rectangle "w" wide (along z) and "h"
// tall, "round" 0 (boxy) to 1 (ellipse), shifted up by "dy" and sideways by
// "dz". "shell" makes it a hollow skin so a cutaway shows the inside.
function buildLoftGeometry(partSpec) {
  const sectionSpecs = (Array.isArray(partSpec.sections) ? partSpec.sections : [])
    .filter((sectionSpec) => sectionSpec && typeof sectionSpec === 'object')
    .slice(0, 16)
    .map((sectionSpec) => ({
      at: finiteNumberOr(sectionSpec.at, 0),
      w: Math.max(0.0001, finiteNumberOr(sectionSpec.w, 1)),
      h: Math.max(0.0001, finiteNumberOr(sectionSpec.h, 1)),
      round: THREE.MathUtils.clamp(finiteNumberOr(sectionSpec.round, 0.6), 0, 1),
      dy: finiteNumberOr(sectionSpec.dy, 0),
      dz: finiteNumberOr(sectionSpec.dz, 0),
      chine: THREE.MathUtils.clamp(finiteNumberOr(sectionSpec.chine, 0), 0, 1),
    }))
    .sort((firstSection, secondSection) => firstSection.at - secondSection.at);
  if (sectionSpecs.length < 2) return new THREE.BoxGeometry(1, 1, 1);

  // Interpolated sections: 8 per span between the given ones.
  const stepsPerSpan = 8;
  const interpolatedSections = [];
  const sectionKeys = ['at', 'w', 'h', 'round', 'dy', 'dz', 'chine'];
  for (let spanIndex = 0; spanIndex < sectionSpecs.length - 1; spanIndex++) {
    const previousSection = sectionSpecs[Math.max(0, spanIndex - 1)];
    const startSection = sectionSpecs[spanIndex];
    const endSection = sectionSpecs[spanIndex + 1];
    const nextSection = sectionSpecs[Math.min(sectionSpecs.length - 1, spanIndex + 2)];
    for (let stepIndex = 0; stepIndex < stepsPerSpan; stepIndex++) {
      const progress = stepIndex / stepsPerSpan;
      const interpolatedSection = {};
      for (const sectionKey of sectionKeys) {
        interpolatedSection[sectionKey] = sectionKey === 'at'
          ? startSection.at + (endSection.at - startSection.at) * progress
          : catmullRomScalar(previousSection[sectionKey], startSection[sectionKey], endSection[sectionKey], nextSection[sectionKey], progress);
      }
      interpolatedSection.w = Math.max(0.0001, interpolatedSection.w);
      interpolatedSection.h = Math.max(0.0001, interpolatedSection.h);
      interpolatedSection.round = THREE.MathUtils.clamp(interpolatedSection.round, 0, 1);
      interpolatedSection.chine = THREE.MathUtils.clamp(interpolatedSection.chine, 0, 1);
      interpolatedSections.push(interpolatedSection);
    }
  }
  interpolatedSections.push({ ...sectionSpecs[sectionSpecs.length - 1] });

  const ringSampleCount = 48;
  const ringPointsFor = (section, inwardOffset) => {
    const halfWidth = Math.max(0.00005, section.w / 2 - inwardOffset);
    const halfHeight = Math.max(0.00005, section.h / 2 - inwardOffset);
    const exponent = 2 / (2 + (1 - section.round) * 8);
    // "chine" (0 to 1): a stealth-jet nose. The upper half turns pointed
    // (sloped sides), the lower half flat and boxy, and they meet in a
    // sharp edge along each side.
    const chineAmount = section.chine || 0;
    const upperExponent = THREE.MathUtils.lerp(exponent, 1.7, chineAmount);
    const lowerExponent = THREE.MathUtils.lerp(exponent, 0.3, chineAmount);
    const lowerHalfHeight = halfHeight * (1 - 0.45 * chineAmount);
    const ringPoints = [];
    for (let sampleIndex = 0; sampleIndex < ringSampleCount; sampleIndex++) {
      const angle = sampleIndex / ringSampleCount * Math.PI * 2;
      const cosine = Math.cos(angle);
      const sine = Math.sin(angle);
      const isUpperHalf = sine >= 0;
      const sampleExponent = isUpperHalf ? upperExponent : lowerExponent;
      ringPoints.push(new THREE.Vector3(
        section.at,
        section.dy + (isUpperHalf ? halfHeight : lowerHalfHeight) * Math.sign(sine) * Math.pow(Math.abs(sine), sampleExponent),
        section.dz + halfWidth * Math.sign(cosine) * Math.pow(Math.abs(cosine), sampleExponent),
      ));
    }
    return ringPoints;
  };

  const shellThickness = Math.max(0, finiteNumberOr(partSpec.shell, 0));
  const outerRings = interpolatedSections.map((section) => ringPointsFor(section, 0));
  const positions = [];
  const pushTriangle = (firstPoint, secondPoint, thirdPoint) => positions.push(...firstPoint.toArray(), ...secondPoint.toArray(), ...thirdPoint.toArray());
  // Faces wind outward: along +x, ring angle running from +z toward +y.
  const stitchRings = (ringList, isInside) => {
    for (let ringIndex = 0; ringIndex < ringList.length - 1; ringIndex++) {
      for (let sampleIndex = 0; sampleIndex < ringSampleCount; sampleIndex++) {
        const nextSampleIndex = (sampleIndex + 1) % ringSampleCount;
        const cornerA = ringList[ringIndex][sampleIndex];
        const cornerB = ringList[ringIndex + 1][sampleIndex];
        const cornerC = ringList[ringIndex + 1][nextSampleIndex];
        const cornerD = ringList[ringIndex][nextSampleIndex];
        if (isInside) { pushTriangle(cornerA, cornerC, cornerB); pushTriangle(cornerA, cornerD, cornerC); }
        else { pushTriangle(cornerA, cornerB, cornerC); pushTriangle(cornerA, cornerC, cornerD); }
      }
    }
  };
  stitchRings(outerRings, false);
  let innerTriangleRange = null;
  if (shellThickness > 0) {
    const innerRings = interpolatedSections.map((section) => ringPointsFor(section, shellThickness));
    const innerFirstTriangle = positions.length / 9;
    stitchRings(innerRings, true);
    innerTriangleRange = [innerFirstTriangle, positions.length / 9];
    // Join outer and inner rims at both ends so the skin is closed.
    for (const [ringIndex, facesBackward] of [[0, true], [outerRings.length - 1, false]]) {
      for (let sampleIndex = 0; sampleIndex < ringSampleCount; sampleIndex++) {
        const nextSampleIndex = (sampleIndex + 1) % ringSampleCount;
        const outerStart = outerRings[ringIndex][sampleIndex], outerNext = outerRings[ringIndex][nextSampleIndex];
        const innerStart = innerRings[ringIndex][sampleIndex], innerNext = innerRings[ringIndex][nextSampleIndex];
        if (facesBackward) { pushTriangle(outerStart, outerNext, innerNext); pushTriangle(outerStart, innerNext, innerStart); }
        else { pushTriangle(outerStart, innerNext, outerNext); pushTriangle(outerStart, innerStart, innerNext); }
      }
    }
  } else {
    for (const [ringIndex, facesBackward] of [[0, true], [outerRings.length - 1, false]]) {
      const ring = outerRings[ringIndex];
      const ringCenter = ring.reduce((sum, ringPoint) => sum.add(ringPoint), new THREE.Vector3()).divideScalar(ring.length);
      for (let sampleIndex = 0; sampleIndex < ringSampleCount; sampleIndex++) {
        const nextSampleIndex = (sampleIndex + 1) % ringSampleCount;
        if (facesBackward) pushTriangle(ringCenter, ring[sampleIndex], ring[nextSampleIndex]);
        else pushTriangle(ringCenter, ring[nextSampleIndex], ring[sampleIndex]);
      }
    }
  }
  const loftGeometry = new THREE.BufferGeometry();
  loftGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  // Smooth shading across the body (positions are shared by value, so merge
  // them before computing normals, then split again for the outline helper).
  const mergedLoftGeometry = mergeVerticesByPosition(loftGeometry);
  mergedLoftGeometry.computeVertexNormals();
  const finishedLoftGeometry = mergedLoftGeometry.toNonIndexed();
  // The inner skin is tinted dark (vertex colors, switched on by a cutaway),
  // so a cut-open body shows a dark cavity behind its insides.
  if (innerTriangleRange) {
    const vertexColors = new Float32Array(finishedLoftGeometry.attributes.position.count * 3).fill(1);
    for (let vertexIndex = innerTriangleRange[0] * 3; vertexIndex < innerTriangleRange[1] * 3; vertexIndex++) {
      vertexColors.set([0.26, 0.27, 0.29], vertexIndex * 3);
    }
    finishedLoftGeometry.setAttribute('color', new THREE.BufferAttribute(vertexColors, 3));
  }
  return finishedLoftGeometry;
}

// Indexes a triangle soup by position so computeVertexNormals smooths it.
function mergeVerticesByPosition(geometry) {
  const positionAttribute = geometry.attributes.position;
  const indexByKey = new Map();
  const uniquePositions = [];
  const triangleIndices = [];
  for (let vertexIndex = 0; vertexIndex < positionAttribute.count; vertexIndex++) {
    const positionKey = `${positionAttribute.getX(vertexIndex).toFixed(5)},${positionAttribute.getY(vertexIndex).toFixed(5)},${positionAttribute.getZ(vertexIndex).toFixed(5)}`;
    let uniqueIndex = indexByKey.get(positionKey);
    if (uniqueIndex === undefined) {
      uniqueIndex = uniquePositions.length / 3;
      indexByKey.set(positionKey, uniqueIndex);
      uniquePositions.push(positionAttribute.getX(vertexIndex), positionAttribute.getY(vertexIndex), positionAttribute.getZ(vertexIndex));
    }
    triangleIndices.push(uniqueIndex);
  }
  const mergedGeometry = new THREE.BufferGeometry();
  mergedGeometry.setAttribute('position', new THREE.Float32BufferAttribute(uniquePositions, 3));
  mergedGeometry.setIndex(triangleIndices);
  return mergedGeometry;
}

// Lofts are built along x; "axis":"y" or "z" stands them up or turns them.
function orientLoftAlongAxis(geometry, axisName) {
  if (axisName === 'y') geometry.rotateZ(Math.PI / 2);
  else if (axisName === 'z') geometry.rotateY(-Math.PI / 2);
  return geometry;
}

// The outline moved inward by "thickness" (each corner where its two
// neighbouring edges, shifted inward, meet).
function insetPolygon(outlinePoints, thickness) {
  let doubledSignedArea = 0;
  outlinePoints.forEach((point, pointIndex) => {
    const nextPoint = outlinePoints[(pointIndex + 1) % outlinePoints.length];
    doubledSignedArea += point.x * nextPoint.y - nextPoint.x * point.y;
  });
  const windingSign = doubledSignedArea >= 0 ? 1 : -1;
  const inwardEdgeNormals = outlinePoints.map((point, pointIndex) => {
    const nextPoint = outlinePoints[(pointIndex + 1) % outlinePoints.length];
    const edgeLength = Math.hypot(nextPoint.x - point.x, nextPoint.y - point.y) || 1;
    return new THREE.Vector2(-(nextPoint.y - point.y) / edgeLength * windingSign, (nextPoint.x - point.x) / edgeLength * windingSign);
  });
  return outlinePoints.map((point, pointIndex) => {
    const previousNormal = inwardEdgeNormals[(pointIndex - 1 + outlinePoints.length) % outlinePoints.length];
    const nextNormal = inwardEdgeNormals[pointIndex];
    const cornerDirection = previousNormal.clone().add(nextNormal);
    const cornerDirectionLength = cornerDirection.length();
    if (cornerDirectionLength < 1e-4) return point.clone().addScaledVector(nextNormal, thickness);
    cornerDirection.divideScalar(cornerDirectionLength);
    // Miter length, capped so sharp corners (a nose tip) don't shoot out.
    const miterLength = Math.min(thickness / Math.max(cornerDirection.dot(nextNormal), 0.2), thickness * 3);
    return point.clone().addScaledVector(cornerDirection, miterLength);
  });
}

function mergeNonIndexedGeometries(geometries) {
  const mergedAttributes = { position: [], normal: [], uv: [] };
  for (const geometry of geometries) {
    const flatGeometry = geometry.index ? geometry.toNonIndexed() : geometry;
    for (const attributeName of Object.keys(mergedAttributes)) {
      const attribute = flatGeometry.getAttribute(attributeName);
      if (attribute) mergedAttributes[attributeName].push(...attribute.array);
    }
  }
  const mergedGeometry = new THREE.BufferGeometry();
  mergedGeometry.setAttribute('position', new THREE.Float32BufferAttribute(mergedAttributes.position, 3));
  mergedGeometry.setAttribute('normal', new THREE.Float32BufferAttribute(mergedAttributes.normal, 3));
  if (mergedAttributes.uv.length) mergedGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(mergedAttributes.uv, 2));
  return mergedGeometry;
}

// A hollow extrusion (a faceted fuselage, a box casing): a thin wall around
// the outline plus thin side plates, so a cutaway shows a hatched skin and
// the parts inside instead of one solid hatched slab.
function buildExtrudedShellGeometry(outlinePoints, extrusionDepth, bevelSize, shellThickness) {
  const innerOutlinePoints = insetPolygon(outlinePoints, shellThickness);
  // A bevel wider than the wall would eat into the hole and thicken the skin.
  const wallBevelSize = Math.min(bevelSize, shellThickness * 0.4);
  // The bevel grows the outline outward and the hole inward, so both are
  // pulled back by it and the wall finishes at its given size (0..depth).
  const wallShape = new THREE.Shape(wallBevelSize > 0 ? insetPolygon(outlinePoints, wallBevelSize) : outlinePoints);
  wallShape.holes.push(new THREE.Path(wallBevelSize > 0 ? insetPolygon(outlinePoints, shellThickness - wallBevelSize) : innerOutlinePoints));
  const wallGeometry = new THREE.ExtrudeGeometry(wallShape, {
    depth: Math.max(0.0001, extrusionDepth - 2 * wallBevelSize), bevelEnabled: wallBevelSize > 0,
    bevelSize: wallBevelSize, bevelThickness: wallBevelSize, bevelOffset: 0, bevelSegments: 2, curveSegments: 12,
  });
  wallGeometry.translate(0, 0, wallBevelSize);
  // The side plates fill the hole, flush with the wall's faces.
  const plateThickness = Math.min(shellThickness, extrusionDepth / 4);
  const nearPlateGeometry = new THREE.ExtrudeGeometry(new THREE.Shape(innerOutlinePoints), { depth: plateThickness, bevelEnabled: false });
  nearPlateGeometry.translate(0, 0, extrusionDepth - plateThickness);
  const farPlateGeometry = new THREE.ExtrudeGeometry(new THREE.Shape(innerOutlinePoints), { depth: plateThickness, bevelEnabled: false });
  return mergeNonIndexedGeometries([wallGeometry, nearPlateGeometry, farPlateGeometry]);
}

function buildPartMaterial(partSpec) {
  const presetName = typeof partSpec.mat === 'string' && MATERIAL_PRESETS[partSpec.mat] ? partSpec.mat : 'plastic';
  const preset = MATERIAL_PRESETS[presetName];
  const partMaterial = new THREE.MeshStandardMaterial({
    color: safeColor(partSpec.color, preset.color),
    roughness: THREE.MathUtils.clamp(finiteNumberOr(partSpec.roughness, preset.roughness), 0, 1),
    metalness: THREE.MathUtils.clamp(finiteNumberOr(partSpec.metalness, preset.metalness), 0, 1),
    // Low on purpose: environment reflections turn metals into chrome.
    envMapIntensity: 0.3,
  });
  const opacity = THREE.MathUtils.clamp(finiteNumberOr(partSpec.opacity, preset.opacity === undefined ? 1 : preset.opacity), 0.05, 1);
  if (opacity < 1) { partMaterial.transparent = true; partMaterial.opacity = opacity; partMaterial.depthWrite = false; }
  if (partMaterial.metalness > 0.5) partMaterial.envMapIntensity = 0.6;
  if (preset.emissive) { partMaterial.emissive.copy(partMaterial.color); partMaterial.emissiveIntensity = preset.emissive; }
  partMaterial.userData.baseOpacity = opacity;
  partMaterial.userData.baseEmissive = partMaterial.emissive.clone();
  partMaterial.userData.baseEmissiveIntensity = partMaterial.emissiveIntensity;
  return partMaterial;
}

// ---------------------------------------------------------------------------
// Outline: an inverted hull pushed out by a constant number of screen pixels
// along smoothed normals (smoothing closes cracks at hard edges).
// ---------------------------------------------------------------------------

const outlineViewportSize = new THREE.Vector2(1, 1);
const sharedOutlineMaterials = new Set();

function buildSmoothedNormalAttribute(geometry) {
  const positionAttribute = geometry.attributes.position;
  const normalAttribute = geometry.attributes.normal;
  const summedNormalByPositionKey = new Map();
  const positionKeyForVertex = (vertexIndex) =>
    `${positionAttribute.getX(vertexIndex).toFixed(4)},${positionAttribute.getY(vertexIndex).toFixed(4)},${positionAttribute.getZ(vertexIndex).toFixed(4)}`;
  for (let vertexIndex = 0; vertexIndex < positionAttribute.count; vertexIndex++) {
    const positionKey = positionKeyForVertex(vertexIndex);
    const summedNormal = summedNormalByPositionKey.get(positionKey) || new THREE.Vector3();
    summedNormal.x += normalAttribute.getX(vertexIndex);
    summedNormal.y += normalAttribute.getY(vertexIndex);
    summedNormal.z += normalAttribute.getZ(vertexIndex);
    summedNormalByPositionKey.set(positionKey, summedNormal);
  }
  const smoothedNormals = new Float32Array(positionAttribute.count * 3);
  for (let vertexIndex = 0; vertexIndex < positionAttribute.count; vertexIndex++) {
    const smoothedNormal = summedNormalByPositionKey.get(positionKeyForVertex(vertexIndex)).clone().normalize();
    smoothedNormals.set([smoothedNormal.x, smoothedNormal.y, smoothedNormal.z], vertexIndex * 3);
  }
  return new THREE.BufferAttribute(smoothedNormals, 3);
}

function buildOutlineMaterial(outlineWidthInPixels) {
  const outlineMaterial = new THREE.ShaderMaterial({
    uniforms: {
      outlineColor: { value: new THREE.Color(currentBackdropStyle.outline) },
      outlineWidthInPixels: { value: outlineWidthInPixels },
      viewportSize: { value: outlineViewportSize },
      outlineOpacity: { value: 1 },
    },
    vertexShader: `
      attribute vec3 smoothedNormal;
      uniform float outlineWidthInPixels;
      uniform vec2 viewportSize;
      #include <clipping_planes_pars_vertex>
      void main() {
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        #include <clipping_planes_vertex>
        vec4 clipPosition = projectionMatrix * mvPosition;
        vec3 viewNormal = normalize(normalMatrix * smoothedNormal);
        vec2 screenDirection = length(viewNormal.xy) > 0.0001 ? normalize(viewNormal.xy) : vec2(0.0);
        clipPosition.xy += screenDirection * outlineWidthInPixels * 2.0 / viewportSize * clipPosition.w;
        gl_Position = clipPosition;
      }`,
    fragmentShader: `
      uniform vec3 outlineColor;
      uniform float outlineOpacity;
      #include <clipping_planes_pars_fragment>
      void main() {
        #include <clipping_planes_fragment>
        gl_FragColor = vec4(outlineColor, outlineOpacity);
        #include <colorspace_fragment>
      }`,
    side: THREE.BackSide,
    clipping: true,
    transparent: false,
  });
  sharedOutlineMaterials.add(outlineMaterial);
  return outlineMaterial;
}

function setBackdropStyle(backdropName) {
  currentBackdropStyle = BACKDROP_STYLES[backdropName] || BACKDROP_STYLES.light;
  sharedOutlineMaterials.forEach((outlineMaterial) => outlineMaterial.uniforms.outlineColor.value.set(currentBackdropStyle.outline));
  calloutLabels.forEach(applyBackdropToCalloutLabel);
}

function attachOutline(partMesh, outlineWidthInPixels = OUTLINE_WIDTH_IN_PIXELS) {
  if (!partMesh.geometry.attributes.smoothedNormal) {
    partMesh.geometry.setAttribute('smoothedNormal', buildSmoothedNormalAttribute(partMesh.geometry));
  }
  const outlineMesh = new THREE.Mesh(partMesh.geometry, buildOutlineMaterial(outlineWidthInPixels));
  outlineMesh.userData.isHelper = true;
  outlineMesh.userData.baseOutlineWidth = outlineWidthInPixels;
  partMesh.add(outlineMesh);
  partMesh.userData.outlineMesh = outlineMesh;
}

// ---------------------------------------------------------------------------
// Scene objects by id, model bounds
// ---------------------------------------------------------------------------

const sceneObjectsById = new Map(); // id -> { object, bounds (Box3 in content space), materials }
const modelBoundsInContentSpace = new THREE.Box3();
let anonymousObjectCounter = 0;

function uniqueObjectId(requestedId, kindPrefix) {
  if (typeof requestedId === 'string' && requestedId.trim()) return requestedId.trim();
  anonymousObjectCounter += 1;
  return `${kindPrefix}_${anonymousObjectCounter}`;
}

function parentObjectFor(parentId) {
  const parentEntry = typeof parentId === 'string' ? sceneObjectsById.get(parentId) : null;
  return parentEntry ? parentEntry.object : modelContent;
}

function applyPlacement(targetObject, placementSpec) {
  const [positionX, positionY, positionZ] = vector3Or(placementSpec.pos, [0, 0, 0]);
  const [rotationX, rotationY, rotationZ] = vector3Or(placementSpec.rot, [0, 0, 0]);
  targetObject.position.set(positionX, positionY, positionZ);
  targetObject.rotation.set(degreesToRadians(rotationX), degreesToRadians(rotationY), degreesToRadians(rotationZ));
}

// Bounds of every real (non-helper) mesh under an object, in content space.
function boundsInContentSpace(rootObject) {
  modelRoot.updateMatrixWorld(true);
  const contentWorldInverse = modelContent.matrixWorld.clone().invert();
  const combinedBounds = new THREE.Box3();
  const meshBounds = new THREE.Box3();
  const meshToContentMatrix = new THREE.Matrix4();
  rootObject.traverse((childObject) => {
    if (!childObject.isMesh || childObject.userData.isHelper) return;
    if (!childObject.geometry.boundingBox) childObject.geometry.computeBoundingBox();
    // One combined matrix: going through world space would inflate the box
    // twice whenever the model is turned.
    meshToContentMatrix.multiplyMatrices(contentWorldInverse, childObject.matrixWorld);
    meshBounds.copy(childObject.geometry.boundingBox).applyMatrix4(meshToContentMatrix);
    combinedBounds.union(meshBounds);
  });
  return combinedBounds;
}

function modelSizeSoFar() {
  if (modelBoundsInContentSpace.isEmpty()) return 1;
  return modelBoundsInContentSpace.getSize(new THREE.Vector3()).length();
}

// Arrows (isArrow) are left out of the model's bounds: like Clicky's flow
// arrows they may run past the object without shrinking it to fit.
// Bumped whenever any part's bounds change, so per-frame caches (part
// corners, label rows) know when to rebuild.
let boundsVersion = 0;

function registerSceneObject(objectId, sceneObject, objectMaterials, isArrow = false) {
  const objectBounds = boundsInContentSpace(sceneObject);
  boundsVersion += 1;
  sceneObjectsById.set(objectId, { object: sceneObject, bounds: objectBounds, materials: objectMaterials, isArrow });
  if (!objectBounds.isEmpty() && !isArrow) modelBoundsInContentSpace.union(objectBounds);
  updateContactShadow();
  return objectBounds;
}

// After something moved: every part's bounds and the model's, again.
function refreshAllBounds() {
  boundsVersion += 1;
  modelBoundsInContentSpace.makeEmpty();
  for (const sceneObjectEntry of sceneObjectsById.values()) {
    if (sceneObjectEntry.isGroup) continue;
    sceneObjectEntry.bounds = boundsInContentSpace(sceneObjectEntry.object);
    if (!sceneObjectEntry.bounds.isEmpty() && !sceneObjectEntry.isArrow) modelBoundsInContentSpace.union(sceneObjectEntry.bounds);
  }
  updateContactShadow();
}

function buildPartMesh(partSpec, partMaterial) {
  const partMesh = new THREE.Mesh(buildPartGeometry(partSpec), partMaterial);
  applyPlacement(partMesh, partSpec);
  return partMesh;
}

// Every part gets the illustration's outline; small parts (pins, passives)
// a thinner one, and specks (pads, solder dots) none, so they don't turn
// into black blobs. Returns the outline width in pixels, 0 for none.
function outlineWidthForPart(partMesh, partSpec) {
  if (partSpec.outline === false) return 0;
  if (!partMesh.geometry.boundingBox) partMesh.geometry.computeBoundingBox();
  const partSize = partMesh.geometry.boundingBox.getSize(new THREE.Vector3()).length();
  if (partSpec.outline === true || modelBoundsInContentSpace.isEmpty()) return OUTLINE_WIDTH_IN_PIXELS;
  const sizeFraction = partSize / modelSizeSoFar();
  if (sizeFraction < 0.012) return 0;
  return sizeFraction < 0.05 ? SMALL_PART_OUTLINE_WIDTH_IN_PIXELS : OUTLINE_WIDTH_IN_PIXELS;
}

// ---------------------------------------------------------------------------
// Contact shadow: a soft dark ellipse under the model
// ---------------------------------------------------------------------------

function buildContactShadowTexture() {
  const shadowCanvas = document.createElement('canvas');
  shadowCanvas.width = 128; shadowCanvas.height = 128;
  const shadowContext = shadowCanvas.getContext('2d');
  const shadowGradient = shadowContext.createRadialGradient(64, 64, 0, 64, 64, 64);
  // A tight contact shadow: nearly solid to 70%, then a short falloff.
  shadowGradient.addColorStop(0, 'rgba(0,0,0,1)');
