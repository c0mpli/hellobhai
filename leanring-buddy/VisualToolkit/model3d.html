  };
  applyBackdropToCalloutLabel(calloutLabel);
  calloutLabels.push(calloutLabel);
  return calloutLabel;
}

// Groups have no bounds of their own (their parts arrive later), so theirs
// are measured on demand.
function boundsOfEntry(sceneObjectEntry) {
  if (!sceneObjectEntry) return new THREE.Box3();
  return sceneObjectEntry.isGroup ? boundsInContentSpace(sceneObjectEntry.object) : sceneObjectEntry.bounds;
}

function projectWorldPointToPage(worldPoint) {
  projectionScratchVector.copy(worldPoint).project(camera);
  return {
    x: (projectionScratchVector.x + 1) / 2 * viewportWidth,
    y: (1 - projectionScratchVector.y) / 2 * viewportHeight,
  };
}

// Anchor dots at least this far apart on screen, so neighbouring leaders
// don't run into each other.
const MINIMUM_ANCHOR_SEPARATION_IN_PIXELS = 42;
const ANCHOR_FRACTIONS_TO_TRY = [0.5, 0.3, 0.7, 0.15, 0.85, 0.05, 0.95];
const anchorRaycaster = new THREE.Raycaster();

// Is this point cut away by a cutaway on that mesh (so not really visible)?
function isPointClippedAway(meshObject, worldPoint) {
  const clippingPlanes = meshObject.material && meshObject.material.clippingPlanes;
  return !!(clippingPlanes && clippingPlanes.some((clippingPlane) => clippingPlane.distanceToPoint(worldPoint) < 0));
}

// Every real mesh that can hide another part (arrows left out: labels may
// point through them). Rebuilt when parts are added or moved.
let cachedOccludingMeshes = [];
let cachedOccludingMeshesVersion = -1;
function occludingMeshes() {
  if (cachedOccludingMeshesVersion === boundsVersion) return cachedOccludingMeshes;
  const arrowMeshes = new Set();
  for (const sceneObjectEntry of sceneObjectsById.values()) {
    if (sceneObjectEntry.isArrow) meshesUnder(sceneObjectEntry.object).forEach((arrowMesh) => arrowMeshes.add(arrowMesh));
  }
  cachedOccludingMeshes = meshesUnder(modelContent).filter((candidateMesh) => !arrowMeshes.has(candidateMesh));
  cachedOccludingMeshesVersion = boundsVersion;
  return cachedOccludingMeshes;
}

// A hit that really blocks the view: not cut away, not hidden, not see-through.
function isBlockingHit(hit) {
  const hitMaterial = hit.object.material;
  if (!hit.object.visible || isPointClippedAway(hit.object, hit.point)) return false;
  return !(hitMaterial && hitMaterial.transparent && hitMaterial.opacity < 0.6);
}

// The point on the part the camera actually sees along the line of sight
// through a spot inside its box (so dots sit on a real face, never in the
// air), or null when the part is hidden there: the first thing the ray
// meets must be the part itself, not something in front of it.
function visibleSurfacePointOnParts(partMeshes, contentPoint) {
  const worldPoint = contentPoint.clone().applyMatrix4(modelContent.matrixWorld);
  const cameraPosition = new THREE.Vector3().setFromMatrixPosition(camera.matrixWorld);
  anchorRaycaster.set(cameraPosition, worldPoint.clone().sub(cameraPosition).normalize());
  const firstBlockingHit = anchorRaycaster.intersectObjects(occludingMeshes(), false).find(isBlockingHit);
  if (!firstBlockingHit) return null;
  return partMeshes.includes(firstBlockingHit.object) ? firstBlockingHit : null;
}

// Picks, once, where on its part each new label points: a visible spot far
// enough from the anchors already placed, and which side its tag goes.
function chooseLabelAnchor(calloutLabel, placedAnchorPoints, modelRectangle) {
  if (calloutLabel.side) return;
  if (calloutLabel.anchorObjectId) {
    const anchorEntry = sceneObjectsById.get(calloutLabel.anchorObjectId);
    const anchorBounds = boundsOfEntry(anchorEntry);
    const partMeshes = anchorEntry ? meshesUnder(anchorEntry.object) : [];
    if (anchorBounds.isEmpty() || !partMeshes.length) {
      calloutLabel.anchorInContentSpace = anchorBounds.isEmpty() ? new THREE.Vector3() : anchorBounds.getCenter(new THREE.Vector3());
    } else {
      const boundsSize = anchorBounds.getSize(new THREE.Vector3());
      // Along the part's longest horizontal side.
      const alongX = boundsSize.x >= boundsSize.z;
      let bestHit = null, bestDistance = -1, bestFallbackPoint = null;
      // Along the middle first, then along the near and far edges, so a
      // ring or frame (empty in the middle) still gets a dot on its rim.
      const candidatePoints = [];
      for (const acrossFraction of [0.5, 0.94, 0.06]) {
        for (const candidateFraction of ANCHOR_FRACTIONS_TO_TRY) {
          const candidatePoint = anchorBounds.getCenter(new THREE.Vector3());
          if (alongX) {
            candidatePoint.x = anchorBounds.min.x + boundsSize.x * candidateFraction;
            candidatePoint.z = anchorBounds.min.z + boundsSize.z * acrossFraction;
          } else {
            candidatePoint.z = anchorBounds.min.z + boundsSize.z * candidateFraction;
            candidatePoint.x = anchorBounds.min.x + boundsSize.x * acrossFraction;
          }
          candidatePoints.push(candidatePoint);
        }
      }
      for (const candidatePoint of candidatePoints) {
        if (!bestFallbackPoint) bestFallbackPoint = candidatePoint.clone();
        const hit = visibleSurfacePointOnParts(partMeshes, candidatePoint);
        if (!hit) continue;
        const hitPagePoint = projectWorldPointToPage(hit.point);
        const nearestDistance = placedAnchorPoints.reduce((nearest, placedPoint) =>
          Math.min(nearest, Math.hypot(placedPoint.x - hitPagePoint.x, placedPoint.y - hitPagePoint.y)), Infinity);
        if (nearestDistance >= MINIMUM_ANCHOR_SEPARATION_IN_PIXELS) { bestHit = hit; break; }
        if (nearestDistance > bestDistance) { bestDistance = nearestDistance; bestHit = hit; }
      }
      if (bestHit) {
        calloutLabel.anchorMesh = bestHit.object;
        calloutLabel.anchorPointInMesh = bestHit.object.worldToLocal(bestHit.point.clone());
      } else {
        calloutLabel.anchorInContentSpace = bestFallbackPoint;
      }
    }
  }
  calloutLabel.anchorPagePoint = currentAnchorPagePoint(calloutLabel);
  calloutLabel.side = calloutLabel.requestedSide || automaticLabelSide(calloutLabel.anchorPagePoint, modelRectangle);
}

// Above or below by where the part sits on screen; a long side view (a jet,
// a train) sends parts at its far ends to a column beside it instead.
function automaticLabelSide(anchorPagePoint, modelRectangle) {
  if (!modelRectangle) return 'top';
  const modelWidth = modelRectangle.right - modelRectangle.left;
  const modelHeight = Math.max(1, modelRectangle.bottom - modelRectangle.top);
  if (modelWidth / modelHeight > 2.2) {
    if (anchorPagePoint.x < modelRectangle.left + modelWidth * 0.08) return 'left';
    if (anchorPagePoint.x > modelRectangle.right - modelWidth * 0.08) return 'right';
  }
  return anchorPagePoint.y < (modelRectangle.top + modelRectangle.bottom) / 2 ? 'top' : 'bottom';
}

const anchorScratchVector = new THREE.Vector3();
function currentAnchorPagePoint(calloutLabel) {
  if (calloutLabel.anchorMesh) {
    return projectWorldPointToPage(calloutLabel.anchorMesh.localToWorld(anchorScratchVector.copy(calloutLabel.anchorPointInMesh)));
  }
  return projectContentPointToPage(calloutLabel.anchorInContentSpace || new THREE.Vector3());
}

// Each part's box on screen (arrows left out: labels may sit over them, as
// Clicky's do). Cached until the view or any bounds change.
let cachedPartRectangles = [];
let cachedPartRectanglesKey = '';
function projectedPartRectangles() {
  const cacheKey = `${boundsVersion}:${viewVersion}`;
  if (cacheKey === cachedPartRectanglesKey) return cachedPartRectangles;
  cachedPartRectanglesKey = cacheKey;
  const partRectangles = [];
  cachedPartRectangles = partRectangles;
  for (const sceneObjectEntry of sceneObjectsById.values()) {
    if (sceneObjectEntry.isGroup || sceneObjectEntry.isArrow || sceneObjectEntry.bounds.isEmpty()) continue;
    partRectangles.push(projectedBoundsRectangle(sceneObjectEntry.bounds));
  }
  return partRectangles;
}

// How close a row of tags sits to the geometry under it, and the shortest
// leader allowed.
const ROW_GAP_TO_GEOMETRY_IN_PIXELS = 26;
const MINIMUM_LEADER_LENGTH_IN_PIXELS = 40;

// Splits labels into rows that fit the width, slides each row's tags apart
// so none overlap while each stays as close as it can to its anchor's x,
// then hugs the row to the geometry directly under (or over) it.
function layoutCalloutRows(labelsOnSide, modelRectangle, side, partRectangles) {
  // A small gap so neighbouring tags read as separate.
  const gapBetweenTags = 8;
  const gapBetweenRows = 8;
  const usableWidth = viewportWidth - 12;
  const sortedLabels = labelsOnSide.slice().sort((firstLabel, secondLabel) => firstLabel.anchorPagePoint.x - secondLabel.anchorPagePoint.x);
  const labelRows = [[]];
  let currentRowWidth = 0;
  for (const calloutLabel of sortedLabels) {
    if (currentRowWidth + calloutLabel.tagWidth > usableWidth && labelRows[labelRows.length - 1].length) {
      labelRows.push([]);
      currentRowWidth = 0;
    }
    labelRows[labelRows.length - 1].push(calloutLabel);
    currentRowWidth += calloutLabel.tagWidth + gapBetweenTags;
  }

  const tagHeight = sortedLabels.length ? Math.max(...sortedLabels.map((calloutLabel) => calloutLabel.tagHeight)) : 34;
  let rowEdge = null; // the outer edge of the previous row, for stacking more rows outward
  labelRows.forEach((rowLabels) => {
    if (!rowLabels.length) return;
    // Tags that would overlap merge into a cluster laid side by side and
    // centered on the average of where each wants to be, so the sideways
    // shift is shared evenly instead of piling up at one end of the row.
    const tagClusters = [];
    for (const calloutLabel of rowLabels) {
      tagClusters.push({ labels: [calloutLabel], width: calloutLabel.tagWidth, desiredOffsetSum: calloutLabel.anchorPagePoint.x - calloutLabel.tagWidth / 2 });
      for (;;) {
        const lastCluster = tagClusters[tagClusters.length - 1];
        const previousCluster = tagClusters[tagClusters.length - 2];
        if (!previousCluster) break;
        const clusterLeft = (cluster) => THREE.MathUtils.clamp(cluster.desiredOffsetSum / cluster.labels.length, 6, Math.max(6, viewportWidth - 6 - cluster.width));
        if (clusterLeft(previousCluster) + previousCluster.width + gapBetweenTags <= clusterLeft(lastCluster)) break;
        // Each label's desired cluster left is its own desired left minus
        // the widths of the tags before it in the cluster.
        let offsetIntoMergedCluster = previousCluster.width + gapBetweenTags;
        let shiftedDesiredSum = 0;
        for (const mergedLabel of lastCluster.labels) {
          shiftedDesiredSum += (mergedLabel.anchorPagePoint.x - mergedLabel.tagWidth / 2) - offsetIntoMergedCluster;
          offsetIntoMergedCluster += mergedLabel.tagWidth + gapBetweenTags;
        }
        previousCluster.labels.push(...lastCluster.labels);
        previousCluster.width += gapBetweenTags + lastCluster.width;
        previousCluster.desiredOffsetSum += shiftedDesiredSum;
        tagClusters.pop();
      }
    }
    for (const tagCluster of tagClusters) {
      let tagLeft = THREE.MathUtils.clamp(tagCluster.desiredOffsetSum / tagCluster.labels.length, 6, Math.max(6, viewportWidth - 6 - tagCluster.width));
      for (const clusterLabel of tagCluster.labels) {
        clusterLabel.targetLeft = tagLeft;
        tagLeft += clusterLabel.tagWidth + gapBetweenTags;
      }
    }

    // The geometry under this row's span (falls back to the whole model).
    const rowLeft = rowLabels[0].targetLeft;
    const rowRight = rowLabels[rowLabels.length - 1].targetLeft + rowLabels[rowLabels.length - 1].tagWidth;
    const rectanglesUnderRow = partRectangles.filter((partRectangle) => partRectangle && partRectangle.right > rowLeft && partRectangle.left < rowRight);
    let rowTop;
    if (side === 'top') {
      const geometryTop = rectanglesUnderRow.length ? Math.min(...rectanglesUnderRow.map((partRectangle) => partRectangle.top)) : modelRectangle.top;
      const highestAnchorY = Math.min(...rowLabels.map((calloutLabel) => calloutLabel.anchorPagePoint.y));
      let rowBottom = Math.min(geometryTop - ROW_GAP_TO_GEOMETRY_IN_PIXELS, highestAnchorY - MINIMUM_LEADER_LENGTH_IN_PIXELS);
      if (rowEdge !== null) rowBottom = Math.min(rowBottom, rowEdge - gapBetweenRows);
      rowTop = rowBottom - tagHeight;
    } else {
      const geometryBottom = rectanglesUnderRow.length ? Math.max(...rectanglesUnderRow.map((partRectangle) => partRectangle.bottom)) : modelRectangle.bottom;
      const lowestAnchorY = Math.max(...rowLabels.map((calloutLabel) => calloutLabel.anchorPagePoint.y));
      rowTop = Math.max(geometryBottom + ROW_GAP_TO_GEOMETRY_IN_PIXELS, lowestAnchorY + MINIMUM_LEADER_LENGTH_IN_PIXELS);
      if (rowEdge !== null) rowTop = Math.max(rowTop, rowEdge + gapBetweenRows);
    }
    rowTop = rowTopClearOfAvoidedAreas(rowTop, rowLeft, rowRight, tagHeight, side);
    if (side === 'top') rowEdge = rowTop; else rowEdge = rowTop + tagHeight;
    const clampedRowTop = THREE.MathUtils.clamp(rowTop, 4, viewportHeight - tagHeight - 4);
    rowLabels.forEach((calloutLabel) => { calloutLabel.targetTop = clampedRowTop; });
  });
}

// Page text to keep clear (the anchor's "avoid" boxes, e.g. a headline next
// to the product photo): a row that would cover one moves outward past it,
// as long as it stays on the page.
function rowTopClearOfAvoidedAreas(rowTop, rowLeft, rowRight, tagHeight, side) {
  let adjustedRowTop = rowTop;
  for (let pass = 0; pass < 3; pass++) {
    const coveredArea = viewState.avoidRectangles.find((avoidRectangle) =>
      avoidRectangle.right > rowLeft && avoidRectangle.left < rowRight
      && avoidRectangle.bottom > adjustedRowTop && avoidRectangle.top < adjustedRowTop + tagHeight);
    if (!coveredArea) break;
    const movedRowTop = side === 'top' ? coveredArea.top - tagHeight - 4 : coveredArea.bottom + 4;
    if (movedRowTop < 4 || movedRowTop > viewportHeight - tagHeight - 4) break;
    adjustedRowTop = movedRowTop;
  }
  return adjustedRowTop;
}

// How far a row tag's leader runs sideways: Clicky's are near vertical.
const MAXIMUM_LEADER_SLANT_IN_PIXELS = 40;
function leaderSlantOf(calloutLabel) {
  const lineStartX = THREE.MathUtils.clamp(calloutLabel.anchorPagePoint.x, calloutLabel.targetLeft + 14, calloutLabel.targetLeft + calloutLabel.tagWidth - 10);
  return Math.abs(calloutLabel.anchorPagePoint.x - lineStartX);
}

// Tags stacked beside the model (left column right-aligned, right column
// left-aligned), each as level with its anchor as the stack allows.
function layoutCalloutColumn(labelsOnSide, modelRectangle, side) {
  const gapBetweenTags = 4;
  const columnGap = 28;
  const sortedLabels = labelsOnSide.slice().sort((firstLabel, secondLabel) => firstLabel.anchorPagePoint.y - secondLabel.anchorPagePoint.y);
  let previousBottom = 4 - gapBetweenTags;
  for (const calloutLabel of sortedLabels) {
    calloutLabel.targetTop = Math.max(calloutLabel.anchorPagePoint.y - calloutLabel.tagHeight / 2, previousBottom + gapBetweenTags);
    previousBottom = calloutLabel.targetTop + calloutLabel.tagHeight;
  }
  let nextTop = viewportHeight - 4 + gapBetweenTags;
  for (let labelIndex = sortedLabels.length - 1; labelIndex >= 0; labelIndex--) {
    const calloutLabel = sortedLabels[labelIndex];
    calloutLabel.targetTop = Math.min(calloutLabel.targetTop, nextTop - gapBetweenTags - calloutLabel.tagHeight);
    nextTop = calloutLabel.targetTop;
  }
  for (const calloutLabel of sortedLabels) {
    const desiredLeft = side === 'left' ? modelRectangle.left - columnGap - calloutLabel.tagWidth : modelRectangle.right + columnGap;
    calloutLabel.targetLeft = THREE.MathUtils.clamp(desiredLeft, 4, viewportWidth - calloutLabel.tagWidth - 4);
  }
}

function updateCalloutLabels(modelRectangle) {
  const visibleLabels = calloutLabels.filter((calloutLabel) => calloutLabel.isVisible);
  const placedAnchorPoints = [];
  for (const calloutLabel of visibleLabels) {
    chooseLabelAnchor(calloutLabel, placedAnchorPoints, modelRectangle);
    calloutLabel.anchorPagePoint = currentAnchorPagePoint(calloutLabel);
    placedAnchorPoints.push(calloutLabel.anchorPagePoint);
    // Measured every frame because the handwriting font may finish loading late.
    calloutLabel.tagWidth = calloutLabel.tagElement.offsetWidth;
    calloutLabel.tagHeight = calloutLabel.tagElement.offsetHeight;
  }
  if (!modelRectangle) return;
  const rowLabels = visibleLabels.filter((calloutLabel) => calloutLabel.side === 'top' || calloutLabel.side === 'bottom');
  const partRectangles = rowLabels.length ? projectedPartRectangles() : [];
  const layoutBothRows = () => {
    layoutCalloutRows(rowLabels.filter((calloutLabel) => calloutLabel.side === 'top'), modelRectangle, 'top', partRectangles);
    layoutCalloutRows(rowLabels.filter((calloutLabel) => calloutLabel.side === 'bottom'), modelRectangle, 'bottom', partRectangles);
  };
  layoutBothRows();
  // Rows are filled in anchor-x order, so leaders can't cross. When a row
  // crowds a tag too far from its anchor (a long slanted leader), one label
  // of that row moves, once, to the opposite row: the one whose anchor is
  // nearest that row, so its new leader stays short. One per frame, so the
  // conflict resolves with the fewest moves.
  for (const crowdedSide of ['top', 'bottom']) {
    const sideLabels = rowLabels.filter((calloutLabel) => calloutLabel.side === crowdedSide);
    if (!sideLabels.some((calloutLabel) => leaderSlantOf(calloutLabel) > MAXIMUM_LEADER_SLANT_IN_PIXELS)) continue;
    const movableLabels = sideLabels.filter((calloutLabel) => !calloutLabel.requestedSide && !calloutLabel.hasSwitchedSide);
    if (!movableLabels.length) continue;
    const labelNearestOppositeRow = movableLabels.reduce((bestLabel, calloutLabel) => {
      const isNearer = crowdedSide === 'top' ? calloutLabel.anchorPagePoint.y > bestLabel.anchorPagePoint.y : calloutLabel.anchorPagePoint.y < bestLabel.anchorPagePoint.y;
      return isNearer ? calloutLabel : bestLabel;
    });
    labelNearestOppositeRow.side = crowdedSide === 'top' ? 'bottom' : 'top';
    labelNearestOppositeRow.hasSwitchedSide = true;
    layoutBothRows();
    break;
  }
  layoutCalloutColumn(visibleLabels.filter((calloutLabel) => calloutLabel.side === 'left'), modelRectangle, 'left');
  layoutCalloutColumn(visibleLabels.filter((calloutLabel) => calloutLabel.side === 'right'), modelRectangle, 'right');

  for (const calloutLabel of visibleLabels) {
    if (calloutLabel.currentLeft === null) {
      calloutLabel.currentLeft = calloutLabel.targetLeft;
      calloutLabel.currentTop = calloutLabel.targetTop;
    }
    calloutLabel.currentLeft += (calloutLabel.targetLeft - calloutLabel.currentLeft) * 0.2;
    calloutLabel.currentTop += (calloutLabel.targetTop - calloutLabel.currentTop) * 0.2;
    calloutLabel.tagElement.style.visibility = 'visible';
    calloutLabel.tagElement.style.transform = `translate(${calloutLabel.currentLeft}px, ${calloutLabel.currentTop}px)`;
    calloutLabel.textElement.style.clipPath = `inset(-30% ${(1 - calloutLabel.textRevealProgress) * 100}% -30% 0)`;

    // Leader line from the tag's edge nearest the model to the anchor dot:
    // bottom or top edge for rows, the side's midpoint for columns.
    let lineStartX, lineStartY;
    if (calloutLabel.side === 'left' || calloutLabel.side === 'right') {
      lineStartX = calloutLabel.side === 'left' ? calloutLabel.currentLeft + calloutLabel.tagWidth : calloutLabel.currentLeft;
      lineStartY = calloutLabel.currentTop + calloutLabel.tagHeight / 2;
    } else {
      lineStartX = THREE.MathUtils.clamp(calloutLabel.anchorPagePoint.x, calloutLabel.currentLeft + 14, calloutLabel.currentLeft + calloutLabel.tagWidth - 10);
      lineStartY = calloutLabel.side === 'top' ? calloutLabel.currentTop + calloutLabel.tagHeight : calloutLabel.currentTop;
    }
    const lineEndX = lineStartX + (calloutLabel.anchorPagePoint.x - lineStartX) * calloutLabel.leaderProgress;
    const lineEndY = lineStartY + (calloutLabel.anchorPagePoint.y - lineStartY) * calloutLabel.leaderProgress;
    for (const lineElement of [calloutLabel.leaderHaloElement, calloutLabel.leaderLineElement]) {
      lineElement.setAttribute('x1', lineStartX);
      lineElement.setAttribute('y1', lineStartY);
      lineElement.setAttribute('x2', lineEndX);
      lineElement.setAttribute('y2', lineEndY);
      lineElement.style.opacity = calloutLabel.leaderProgress > 0 ? '1' : '0';
    }
    calloutLabel.anchorDotElement.setAttribute('cx', calloutLabel.anchorPagePoint.x);
    calloutLabel.anchorDotElement.setAttribute('cy', calloutLabel.anchorPagePoint.y);
    calloutLabel.anchorDotElement.setAttribute('r', 4.6 * calloutLabel.dotProgress);
    calloutLabel.lineStartPagePoint = { x: lineStartX, y: lineStartY };
  }
}

// ---------------------------------------------------------------------------
// Highlights and spinning parts
// ---------------------------------------------------------------------------

const HIGHLIGHT_GLOW_COLOR = new THREE.Color(0xfff0d2);
const spinningObjects = []; // { object, axisName, radiansPerSecond }
const highlightPulses = []; // { materials, startTime }

function updateHighlightsAndSpins(now, secondsSinceLastFrame) {
  for (const spinningObject of spinningObjects) {
    spinningObject.object.rotation[spinningObject.axisName] += spinningObject.radiansPerSecond * secondsSinceLastFrame;
  }
  for (let pulseIndex = highlightPulses.length - 1; pulseIndex >= 0; pulseIndex--) {
    const highlightPulse = highlightPulses[pulseIndex];
    const elapsedSeconds = (now - highlightPulse.startTime) / 1000;
    const pulseCycleCount = 3;
    const isFinished = elapsedSeconds > pulseCycleCount * 1.1;
    // A soft warm-white glow: the pen's saturated gold turned metal parts
    // into a yellow splash that looked like an explosion.
    const glowStrength = isFinished ? 0 : (1 - Math.cos(elapsedSeconds / 1.1 * Math.PI * 2)) / 2 * 0.3;
    for (const highlightedMaterial of highlightPulse.materials) {
      // Parts that already glow (flames, leds) keep their own color; the rest
      // get the glow color at the pulse's strength. (emissiveIntensity
      // defaults to 1, so it must not be max()'d with the base: that lit
      // highlighted parts at full strength, washing them out to ivory.)
      const isAlreadyGlowing = highlightedMaterial.userData.baseEmissive.getHex() !== 0;
      if (isAlreadyGlowing) {
        highlightedMaterial.emissiveIntensity = highlightedMaterial.userData.baseEmissiveIntensity + glowStrength;
      } else {
        highlightedMaterial.emissive.copy(HIGHLIGHT_GLOW_COLOR);
        highlightedMaterial.emissiveIntensity = glowStrength;
      }
    }
    if (isFinished) {
      highlightPulse.materials.forEach((highlightedMaterial) => {
        highlightedMaterial.emissive.copy(highlightedMaterial.userData.baseEmissive);
        highlightedMaterial.emissiveIntensity = highlightedMaterial.userData.baseEmissiveIntensity;
      });
      highlightPulses.splice(pulseIndex, 1);
    }
  }
}

// ---------------------------------------------------------------------------
// Commands
// ---------------------------------------------------------------------------

// The pen draws over a part: it scribbles across the part's on-screen box
// while the part grows in, so it looks sketched into place.
async function revealObjectWithPen(objectToReveal, objectBounds, durationInMilliseconds) {
  const finalScale = objectToReveal.scale.clone();
  objectToReveal.scale.setScalar(0.0001);
  objectToReveal.visible = true;
  const scribblePoint = (progress) => {
    const rectangle = projectedBoundsRectangle(objectBounds);
    if (!rectangle) return null;
    const insetX = (rectangle.right - rectangle.left) * 0.18;
    const insetY = (rectangle.bottom - rectangle.top) * 0.22;
    return {
      x: rectangle.left + insetX + (rectangle.right - rectangle.left - 2 * insetX) * progress,
      y: rectangle.top + insetY + (rectangle.bottom - rectangle.top - 2 * insetY) * (0.5 + 0.5 * Math.sin(progress * Math.PI * 5)),
    };
  };
  // Glide to where this part starts.
  setPenTarget(() => scribblePoint(0), false);
  await waitMilliseconds(260);
  let revealProgress = 0;
  setPenTarget(() => scribblePoint(revealProgress), true);
  await animateOverDuration(durationInMilliseconds, (progress) => {
    revealProgress = progress;
    const scaleFactor = Math.max(0.0001, easeOutBack(progress));
    objectToReveal.scale.set(finalScale.x * scaleFactor, finalScale.y * scaleFactor, finalScale.z * scaleFactor);
  });
  objectToReveal.scale.copy(finalScale);
  setPenTarget(penState.targetProvider, false);
}

// "sit":"<id>" drops an object straight down (or up) so its bottom rests
// on the top of that part: no mental arithmetic with centers, so nothing
// floats or sinks. (Assumes the object's parent isn't rotated.)
function seatOnTarget(sceneObject, placementSpec) {
  const targetEntry = typeof placementSpec.sit === 'string' ? sceneObjectsById.get(placementSpec.sit) : null;
  if (!targetEntry) return;
  const targetBounds = boundsOfEntry(targetEntry);
  const ownBounds = boundsInContentSpace(sceneObject);
  if (targetBounds.isEmpty() || ownBounds.isEmpty()) return;
  sceneObject.position.y += targetBounds.max.y - ownBounds.min.y;
}

// The height a helper's footprint sits at: on top of its "sit" part, or pos[1].
function surfaceHeightFor(helperSpec) {
  const targetEntry = typeof helperSpec.sit === 'string' ? sceneObjectsById.get(helperSpec.sit) : null;
  const targetBounds = targetEntry ? boundsOfEntry(targetEntry) : null;
  if (targetBounds && !targetBounds.isEmpty()) return targetBounds.max.y;
  return vector3Or(helperSpec.pos, [0, 0, 0])[1];
}

// Builds and registers a part without animating it in.
function addPartWithoutReveal(partSpec, partId) {
  const partMaterial = buildPartMaterial(partSpec);
  const partMesh = buildPartMesh(partSpec, partMaterial);
  parentObjectFor(partSpec.in).add(partMesh);
  seatOnTarget(partMesh, partSpec);
  const outlineWidth = outlineWidthForPart(partMesh, partSpec);
  if (outlineWidth > 0) attachOutline(partMesh, outlineWidth);
  return { partMesh, partMaterial };
}

async function runPartCommand(partSpec) {
  const partId = uniqueObjectId(partSpec.id, 'part');
  const { partMesh, partMaterial } = addPartWithoutReveal(partSpec, partId);
  // "from": the part appears there, then slides into its real place.
  const finalPosition = partMesh.position.clone();
  if (Array.isArray(partSpec.from)) partMesh.position.set(...vector3Or(partSpec.from, finalPosition.toArray()));
  const partBounds = registerSceneObject(partId, partMesh, [partMaterial]);
  await revealObjectWithPen(partMesh, partBounds, 520);
  if (Array.isArray(partSpec.from)) {
    await tweenObjectPlacement(sceneObjectsById.get(partId), finalPosition, null, finiteNumberOr(partSpec.ms, 900));
  }
}

async function runGroupCommand(groupSpec) {
  const groupId = uniqueObjectId(groupSpec.id, 'group');
  const groupObject = new THREE.Group();
  applyPlacement(groupObject, groupSpec);
  parentObjectFor(groupSpec.in).add(groupObject);
  sceneObjectsById.set(groupId, { object: groupObject, bounds: new THREE.Box3(), materials: [], isGroup: true });
}

// Repeats one part: a straight line ("step"), a grid ("step" + "step2"), or
// a ring around an axis ("radial"), e.g. header pins or compressor blades.
async function runArrayCommand(arraySpec) {
  const arrayId = uniqueObjectId(arraySpec.id, 'array');
  const partSpec = arraySpec.of && typeof arraySpec.of === 'object' ? arraySpec.of : { shape: 'box', size: [1, 1, 1] };
  const primaryCount = THREE.MathUtils.clamp(Math.round(finiteNumberOr(arraySpec.count, 4)), 1, 120);
  const secondaryCount = THREE.MathUtils.clamp(Math.round(finiteNumberOr(arraySpec.count2, 1)), 1, 20);
  const primaryStep = new THREE.Vector3(...vector3Or(arraySpec.step, [1, 0, 0]));
  const secondaryStep = new THREE.Vector3(...vector3Or(arraySpec.step2, [0, 0, 1]));
  const radialSpec = arraySpec.radial && typeof arraySpec.radial === 'object' ? arraySpec.radial : null;

  const arrayGroup = new THREE.Group();
  applyPlacement(arrayGroup, arraySpec);
  parentObjectFor(arraySpec.in).add(arrayGroup);
  const sharedMaterial = buildPartMaterial(partSpec);
  const templateMesh = buildPartMesh(partSpec, sharedMaterial);
  const copyMeshes = [];

  for (let secondaryIndex = 0; secondaryIndex < (radialSpec ? 1 : secondaryCount); secondaryIndex++) {
    for (let primaryIndex = 0; primaryIndex < primaryCount; primaryIndex++) {
      const copyMesh = templateMesh.clone();
      if (radialSpec) {
        const radialAxisName = radialSpec.axis === 'x' || radialSpec.axis === 'z' ? radialSpec.axis : 'y';
        const radialPivot = new THREE.Group();
        radialPivot.position.set(...vector3Or(radialSpec.center, [0, 0, 0]));
        radialPivot.rotation[radialAxisName] = primaryIndex / primaryCount * Math.PI * 2;
        radialPivot.add(copyMesh);
        arrayGroup.add(radialPivot);
      } else {
        copyMesh.position.addScaledVector(primaryStep, primaryIndex).addScaledVector(secondaryStep, secondaryIndex);
        arrayGroup.add(copyMesh);
      }
      copyMeshes.push(copyMesh);
    }
  }
  const copyOutlineWidth = outlineWidthForPart(templateMesh, partSpec);
  if (copyOutlineWidth > 0) copyMeshes.forEach((copyMesh) => attachOutline(copyMesh, copyOutlineWidth));
  seatOnTarget(arrayGroup, arraySpec);
  const arrayBounds = registerSceneObject(arrayId, arrayGroup, [sharedMaterial]);

  // Copies pop in one after another with the pen running along them.
  const finalScale = templateMesh.scale.clone();
  copyMeshes.forEach((copyMesh) => copyMesh.scale.setScalar(0.0001));
  const copyCenter = (copyMesh) => projectContentPointToPage(boundsInContentSpace(copyMesh).getCenter(new THREE.Vector3()));
  const arrayRectangleStart = () => {
    const rectangle = projectedBoundsRectangle(arrayBounds);
    return rectangle ? { x: rectangle.left, y: (rectangle.top + rectangle.bottom) / 2 } : null;
  };
  setPenTarget(arrayRectangleStart, false);
  await waitMilliseconds(240);
  const totalDuration = Math.min(1400, 260 + copyMeshes.length * 22);
  let lastStartedCopyIndex = 0;
  const copyCenterCache = new Map();
  setPenTarget(() => {
    const copyMesh = copyMeshes[lastStartedCopyIndex];
    if (!copyMeshes.length) return null;
    if (!copyCenterCache.has(lastStartedCopyIndex)) copyCenterCache.set(lastStartedCopyIndex, copyCenter(copyMesh));
    return copyCenterCache.get(lastStartedCopyIndex);
  }, true);
  await animateOverDuration(totalDuration, (progress) => {
    copyMeshes.forEach((copyMesh, copyIndex) => {
      const copyStart = copyIndex / Math.max(1, copyMeshes.length) * 0.75;
      const copyProgress = THREE.MathUtils.clamp((progress - copyStart) / 0.25, 0, 1);
      if (copyProgress > 0) lastStartedCopyIndex = copyIndex;
      const scaleFactor = Math.max(0.0001, easeOutBack(copyProgress));
      copyMesh.scale.set(finalScale.x * scaleFactor, finalScale.y * scaleFactor, finalScale.z * scaleFactor);
    });
    copyCenterCache.clear();
  });
  copyMeshes.forEach((copyMesh) => copyMesh.scale.copy(finalScale));
  setPenTarget(penState.targetProvider, false);
}

async function runCutawayCommand(cutawaySpec) {
  const directionVector = CUTAWAY_DIRECTIONS[cutawaySpec.remove] || CUTAWAY_DIRECTIONS['+z'];
  const removedSideDirection = new THREE.Vector3(...directionVector);
  const finalPlaneOffset = finiteNumberOr(cutawaySpec.at, 0);
  const cutaway = {
    removedSideDirection,
    planeOffset: finalPlaneOffset,
    localPlane: new THREE.Plane(removedSideDirection.clone().negate(), finalPlaneOffset),
    worldPlane: new THREE.Plane(),
    capMeshes: [],
  };
  const targetIds = Array.isArray(cutawaySpec.parts) ? cutawaySpec.parts : [];
  const targetMeshes = targetIds.flatMap((targetId) => {
    const targetEntry = sceneObjectsById.get(targetId);
    return targetEntry ? meshesUnder(targetEntry.object) : [];
  });
  if (!targetMeshes.length) return;
  // The inside of a cut-open shell reads as a dark cavity behind the parts
  // ("inside":"#rrggbb" picks another color; "inside":false keeps the paint).
  const showsDarkInside = cutawaySpec.inside !== false;
  for (const targetMesh of targetMeshes) {
    targetMesh.material = targetMesh.material.clone();
    targetMesh.material.userData = { ...targetMesh.material.userData };
    targetMesh.material.clippingPlanes = [cutaway.worldPlane];
    targetMesh.material.side = showsDarkInside ? THREE.FrontSide : THREE.DoubleSide;
    // A lofted shell's inner skin carries its dark tint as vertex colors.
    if (showsDarkInside && targetMesh.geometry.attributes.color) targetMesh.material.vertexColors = true;
    if (showsDarkInside) {
      const insideMaterialBackSide = buildPartMaterial({ mat: 'cavity', color: cutawaySpec.inside });
      insideMaterialBackSide.side = THREE.BackSide;
      insideMaterialBackSide.clippingPlanes = [cutaway.worldPlane];
      const insideMesh = new THREE.Mesh(targetMesh.geometry, insideMaterialBackSide);
      insideMesh.userData.isHelper = true;
      targetMesh.add(insideMesh);
    }
    const outlineMesh = targetMesh.userData.outlineMesh;
    if (outlineMesh) outlineMesh.material.clippingPlanes = [cutaway.worldPlane];
    addStencilCap(targetMesh, cutaway);
  }
  activeCutaways.push(cutaway);

  // Animate the cut sweeping in from outside the model to its final depth.
  const targetBounds = new THREE.Box3();
  targetMeshes.forEach((targetMesh) => targetBounds.union(boundsInContentSpace(targetMesh)));
  const startingPlaneOffset = Math.max(...boxCorners(targetBounds).map((cornerPoint) => cornerPoint.dot(removedSideDirection))) + modelSizeSoFar() * 0.01;
  const pageCenterOfCut = () => {
    const cutCenter = targetBounds.getCenter(new THREE.Vector3());
    cutCenter.addScaledVector(removedSideDirection, cutaway.planeOffset - cutCenter.dot(removedSideDirection));
    return projectContentPointToPage(cutCenter);
  };
  setPenTarget(pageCenterOfCut, false);
  await waitMilliseconds(250);
  setPenTarget(pageCenterOfCut, true);
  await animateOverDuration(900, (progress) => {
    cutaway.planeOffset = startingPlaneOffset + (finalPlaneOffset - startingPlaneOffset) * easeInOutCubic(progress);
  });
  cutaway.planeOffset = finalPlaneOffset;
  setPenTarget(pageCenterOfCut, false);
}

async function runLabelCommand(labelSpec) {
  if (!labelSpec.text) return;
  const calloutLabel = createCalloutLabel(labelSpec);
  calloutLabel.isVisible = true;
  const textHeadPoint = () => calloutLabel.currentLeft === null ? null : {
    x: calloutLabel.currentLeft + 15 + (calloutLabel.tagWidth - 27) * calloutLabel.textRevealProgress,
    y: calloutLabel.currentTop + calloutLabel.tagHeight * 0.62,
  };
  // Wait one frame so the tag has been measured and placed.
  await waitMilliseconds(32);
  setPenTarget(textHeadPoint, false);
  await waitMilliseconds(240);
  setPenTarget(textHeadPoint, true);
  pencilScratchSound.setDrawing(false);
  const letterCount = Math.max(1, calloutLabel.textElement.textContent.length);
  let lastTickedLetter = -1;
  await animateOverDuration(Math.min(1100, 160 + letterCount * 70), (progress) => {
    calloutLabel.textRevealProgress = progress;
    const currentLetter = Math.floor(progress * letterCount);
    if (currentLetter !== lastTickedLetter && currentLetter < letterCount) {
      lastTickedLetter = currentLetter;
      pencilScratchSound.tick();
    }
  });
  calloutLabel.textRevealProgress = 1;
  // Then the leader line runs from the tag down (or up) to the part.
  const leaderHeadPoint = () => {
    if (!calloutLabel.lineStartPagePoint) return null;
    return {
      x: calloutLabel.lineStartPagePoint.x + (calloutLabel.anchorPagePoint.x - calloutLabel.lineStartPagePoint.x) * calloutLabel.leaderProgress,
      y: calloutLabel.lineStartPagePoint.y + (calloutLabel.anchorPagePoint.y - calloutLabel.lineStartPagePoint.y) * calloutLabel.leaderProgress,
    };
  };
  setPenTarget(leaderHeadPoint, true);
  penState.isDrawing = true;
  pencilScratchSound.setDrawing(true);
  await animateOverDuration(420, (progress) => { calloutLabel.leaderProgress = easeOutCubic(progress); });
  calloutLabel.leaderProgress = 1;
  await animateOverDuration(160, (progress) => { calloutLabel.dotProgress = easeOutBack(progress); });
  calloutLabel.dotProgress = 1;
  setPenTarget(leaderHeadPoint, false);
}

async function runFocusCommand(focusSpec) {
  const focusBounds = typeof focusSpec.id === 'string' ? boundsOfEntry(sceneObjectsById.get(focusSpec.id)) : new THREE.Box3();
  if (!focusBounds.isEmpty()) {
    const paddedBounds = focusBounds.clone();
    paddedBounds.expandByScalar(focusBounds.getSize(new THREE.Vector3()).length() * 0.25);
    viewState.focusBounds = paddedBounds;
  } else {
    viewState.focusBounds = null;
  }
  await waitMilliseconds(600);
}

async function runHighlightCommand(highlightSpec) {
  const highlightEntry = typeof highlightSpec.id === 'string' ? sceneObjectsById.get(highlightSpec.id) : null;
  if (!highlightEntry) return;
  const highlightMaterials = new Set();
  meshesUnder(highlightEntry.object).forEach((highlightedMesh) => highlightMaterials.add(highlightedMesh.material));
  highlightPulses.push({ materials: Array.from(highlightMaterials), startTime: performance.now() });
  const highlightBounds = boundsOfEntry(highlightEntry);
  setPenTarget(() => {
    const rectangle = projectedBoundsRectangle(highlightBounds);
    return rectangle ? { x: (rectangle.left + rectangle.right) / 2, y: (rectangle.top + rectangle.bottom) / 2 } : null;
  }, false);
  await waitMilliseconds(350);
}

async function runFadeCommand(fadeSpec) {
  const fadeEntry = typeof fadeSpec.id === 'string' ? sceneObjectsById.get(fadeSpec.id) : null;
  if (!fadeEntry) return;
  const targetOpacity = THREE.MathUtils.clamp(finiteNumberOr(fadeSpec.opacity, 0.15), 0, 1);
  const fadedMaterials = new Set();
  meshesUnder(fadeEntry.object).forEach((fadedMesh) => {
    fadedMesh.material = fadedMesh.material.clone();
    fadedMesh.material.userData = { ...fadedMesh.material.userData };
    fadedMesh.material.transparent = true;
    fadedMaterials.add(fadedMesh.material);
    if (fadedMesh.userData.outlineMesh) fadedMesh.userData.outlineMesh.visible = targetOpacity > 0.6;
  });
  const startingOpacities = Array.from(fadedMaterials).map((fadedMaterial) => fadedMaterial.opacity);
  await animateOverDuration(600, (progress) => {
    Array.from(fadedMaterials).forEach((fadedMaterial, materialIndex) => {
      fadedMaterial.opacity = startingOpacities[materialIndex] + (targetOpacity - startingOpacities[materialIndex]) * progress;
      fadedMaterial.depthWrite = fadedMaterial.opacity > 0.95;
    });
  });
  if (targetOpacity === 0) meshesUnder(fadeEntry.object).forEach((fadedMesh) => { fadedMesh.visible = false; });
}

function runSpinCommand(spinSpec) {
  const spinEntry = typeof spinSpec.id === 'string' ? sceneObjectsById.get(spinSpec.id) : null;
  if (!spinEntry) return;
  const spinAxisName = spinSpec.axis === 'x' || spinSpec.axis === 'z' ? spinSpec.axis : 'y';
  const existingSpin = spinningObjects.find((spinningObject) => spinningObject.object === spinEntry.object);
  const radiansPerSecond = THREE.MathUtils.clamp(finiteNumberOr(spinSpec.speed, 1), -6, 6) * Math.PI;
  if (existingSpin) { existingSpin.axisName = spinAxisName; existingSpin.radiansPerSecond = radiansPerSecond; }
  else spinningObjects.push({ object: spinEntry.object, axisName: spinAxisName, radiansPerSecond });
}

// Backdrop (outline and leader colors) and the contact shadow, set by an
// anchor or camera line.
function applyLookOptions(lookSpec) {
  if (lookSpec.backdrop === 'dark' || lookSpec.backdrop === 'light') setBackdropStyle(lookSpec.backdrop);
  if (typeof lookSpec.shadow === 'boolean') { isContactShadowEnabled = lookSpec.shadow; updateContactShadow(); }
}

// The camera eases to the new view over about a second, so a step can
// re-frame the model while its parts pop in.
function runCameraCommand(cameraSpec) {
  const namedViews = {
    front: [0, 8], back: [180, 8], left: [90, 8], right: [-90, 8], top: [0, 80], iso: [-35, 28], side: [-90, 6],
  };
  const namedView = namedViews[cameraSpec.view];
  if (namedView) { viewState.targetAzimuthInRadians = degreesToRadians(namedView[0]); viewState.targetElevationInRadians = degreesToRadians(namedView[1]); }
  if (cameraSpec.view === 'anchor' && viewState.anchorView) {
    viewState.targetAzimuthInRadians = viewState.anchorView.azimuth;
    viewState.targetElevationInRadians = viewState.anchorView.elevation;
    viewState.targetRollInRadians = viewState.anchorView.roll;
    viewState.targetZoomMultiplier = 1;
  }
  if (cameraSpec.azimuth !== undefined) viewState.targetAzimuthInRadians = degreesToRadians(cameraSpec.azimuth);
  if (cameraSpec.elevation !== undefined) viewState.targetElevationInRadians = degreesToRadians(THREE.MathUtils.clamp(finiteNumberOr(cameraSpec.elevation, 24), -80, 85));
  if (cameraSpec.roll !== undefined) viewState.targetRollInRadians = degreesToRadians(THREE.MathUtils.clamp(finiteNumberOr(cameraSpec.roll, 0), -45, 45));
  if (cameraSpec.zoom !== undefined) viewState.targetZoomMultiplier = THREE.MathUtils.clamp(finiteNumberOr(cameraSpec.zoom, 1), 0.4, 4);
  applyLookOptions(cameraSpec);
  viewState.dragYaw = 0;
  viewState.dragPitch = 0;
}

// Puts the model on the real object: "box" is the object's tight box in the
// screenshot's pixels, yaw/pitch/roll how it is turned there. "place"
// puts it over the object or beside it (left, right, above, below,
// beside), "scale" grows or shrinks it relative to the box.
function runAnchorCommand(anchorSpec) {
  const anchorBox = Array.isArray(anchorSpec.box) ? anchorSpec.box.slice(0, 4).map((value) => finiteNumberOr(value, NaN)) : [];
  if (anchorBox.length === 4 && anchorBox.every(Number.isFinite)) {
    const horizontalScale = screenshotSizeInPixels ? viewportWidth / screenshotSizeInPixels.width : 1;
    const verticalScale = screenshotSizeInPixels ? viewportHeight / screenshotSizeInPixels.height : 1;
    let rectangleWidth = Math.abs(anchorBox[2] - anchorBox[0]) * horizontalScale;
    let rectangleHeight = Math.abs(anchorBox[3] - anchorBox[1]) * verticalScale;
    let centerX = (anchorBox[0] + anchorBox[2]) / 2 * horizontalScale;
    let centerY = (anchorBox[1] + anchorBox[3]) / 2 * verticalScale;
    let placement = anchorSpec.place;
    // Beside a photo the model matches the photo's size (it may only grow a
    // little); over a small object in a video it may grow more.
    const isBesideThePhoto = ['beside', 'left', 'right', 'above', 'below'].includes(placement);
    const sizeScale = THREE.MathUtils.clamp(finiteNumberOr(anchorSpec.scale, 1), 0.4, isBesideThePhoto ? 1.1 : 2.5);
    const originalWidth = rectangleWidth, originalHeight = rectangleHeight;
    rectangleWidth = Math.max(60, rectangleWidth * sizeScale);
    rectangleHeight = Math.max(40, rectangleHeight * sizeScale);
    if (placement === 'beside') placement = centerX > viewportWidth / 2 ? 'left' : 'right';
    const besideGap = 24;
    if (placement === 'left') centerX -= (originalWidth + rectangleWidth) / 2 + besideGap;
    if (placement === 'right') centerX += (originalWidth + rectangleWidth) / 2 + besideGap;
    if (placement === 'above') centerY -= (originalHeight + rectangleHeight) / 2 + besideGap;
    if (placement === 'below') centerY += (originalHeight + rectangleHeight) / 2 + besideGap;
    // Kept on the page (labels need a little room around it too).
    rectangleWidth = Math.min(rectangleWidth, viewportWidth - 24);
    rectangleHeight = Math.min(rectangleHeight, viewportHeight - 24);
    centerX = THREE.MathUtils.clamp(centerX, rectangleWidth / 2 + 12, viewportWidth - rectangleWidth / 2 - 12);
    centerY = THREE.MathUtils.clamp(centerY, rectangleHeight / 2 + 12, viewportHeight - rectangleHeight / 2 - 12);
    viewState.fitRectangle = {
      left: centerX - rectangleWidth / 2, top: centerY - rectangleHeight / 2,
      right: centerX + rectangleWidth / 2, bottom: centerY + rectangleHeight / 2,
    };
    viewState.isAnchored = true;
    viewState.avoidRectangles = (Array.isArray(anchorSpec.avoid) ? anchorSpec.avoid.slice(0, 8) : [])
      .map((avoidBox) => (Array.isArray(avoidBox) ? avoidBox.slice(0, 4).map((value) => finiteNumberOr(value, NaN)) : []))
      .filter((avoidBox) => avoidBox.length === 4 && avoidBox.every(Number.isFinite))
      .map((avoidBox) => ({
        left: Math.min(avoidBox[0], avoidBox[2]) * horizontalScale, right: Math.max(avoidBox[0], avoidBox[2]) * horizontalScale,
        top: Math.min(avoidBox[1], avoidBox[3]) * verticalScale, bottom: Math.max(avoidBox[1], avoidBox[3]) * verticalScale,
      }));
    viewState.fitScaleCorrection = 1;
    viewState.fitCenterCorrection = { x: 0, y: 0 };
  }
  const anchorAzimuth = degreesToRadians(finiteNumberOr(anchorSpec.yaw, -25));
  const anchorElevation = degreesToRadians(THREE.MathUtils.clamp(finiteNumberOr(anchorSpec.pitch, 22), -80, 85));
  const anchorRoll = degreesToRadians(THREE.MathUtils.clamp(finiteNumberOr(anchorSpec.roll, 0), -45, 45));
  viewState.anchorView = { azimuth: anchorAzimuth, elevation: anchorElevation, roll: anchorRoll };
  // Before any part exists the view jumps there; later it eases.
  const isFirstView = modelBoundsInContentSpace.isEmpty();
  viewState.targetAzimuthInRadians = anchorAzimuth;
  viewState.targetElevationInRadians = anchorElevation;
  viewState.targetRollInRadians = anchorRoll;
  if (isFirstView) {
    viewState.azimuthInRadians = anchorAzimuth;
    viewState.elevationInRadians = anchorElevation;
    viewState.rollInRadians = anchorRoll;
  }
  applyLookOptions(anchorSpec);
}

// Moves an object to a new position (and turn) over "durationInMilliseconds"
// while the pen rides along on it.
async function tweenObjectPlacement(sceneObjectEntry, targetPosition, targetQuaternion, durationInMilliseconds) {
  if (!sceneObjectEntry) return;
  const movingObject = sceneObjectEntry.object;
  const startPosition = movingObject.position.clone();
  const startQuaternion = movingObject.quaternion.clone();
  const endQuaternion = targetQuaternion || startQuaternion.clone();
  const startCenter = boundsOfEntry(sceneObjectEntry).getCenter(new THREE.Vector3());
  const penPointScratch = new THREE.Vector3();
  setPenTarget(() => projectContentPointToPage(penPointScratch.copy(startCenter).add(movingObject.position).sub(startPosition)), false);
  let tweenFrameCount = 0;
  await animateOverDuration(THREE.MathUtils.clamp(durationInMilliseconds, 200, 2000), (progress) => {
    const easedProgress = easeInOutCubic(progress);
    movingObject.position.lerpVectors(startPosition, targetPosition, easedProgress);
    movingObject.quaternion.slerpQuaternions(startQuaternion, endQuaternion, easedProgress);
    // Bounds follow the moving part every few frames, so labels and the fit
    // track it instead of snapping when it lands.
    tweenFrameCount += 1;
    if (tweenFrameCount % 4 === 0) refreshAllBounds();
  });
  movingObject.position.copy(targetPosition);
  movingObject.quaternion.copy(endQuaternion);
  refreshAllBounds();
}

// {"t":"move","id":..,"to":[x,y,z] | "by":[dx,dy,dz],"rot":[..],"ms":..}:
// how a part plugs in, a lid lifts off, a module lowers into its socket.
async function runMoveCommand(moveSpec) {
  const movingEntry = typeof moveSpec.id === 'string' ? sceneObjectsById.get(moveSpec.id) : null;
  if (!movingEntry) return;
  const startPosition = movingEntry.object.position.clone();
  let targetPosition = startPosition.clone();
  if (Array.isArray(moveSpec.to)) targetPosition = new THREE.Vector3(...vector3Or(moveSpec.to, startPosition.toArray()));
  else if (Array.isArray(moveSpec.by)) targetPosition.add(new THREE.Vector3(...vector3Or(moveSpec.by, [0, 0, 0])));
  let targetQuaternion = null;
  if (Array.isArray(moveSpec.rot)) {
    const [rotationX, rotationY, rotationZ] = vector3Or(moveSpec.rot, [0, 0, 0]);
    targetQuaternion = new THREE.Quaternion().setFromEuler(new THREE.Euler(degreesToRadians(rotationX), degreesToRadians(rotationY), degreesToRadians(rotationZ)));
  }
  await tweenObjectPlacement(movingEntry, targetPosition, targetQuaternion, finiteNumberOr(moveSpec.ms, 900));
}

// {"t":"explode","ids":[a,b,c],"gap":[0,8,0]}: the i-th part moves by i x
// gap, all together, so a stack of layers fans out.
async function runExplodeCommand(explodeSpec) {
  const explodeGap = new THREE.Vector3(...vector3Or(explodeSpec.gap, [0, 10, 0]));
  const explodeIds = Array.isArray(explodeSpec.ids) ? explodeSpec.ids.slice(0, 30) : [];
  const durationInMilliseconds = finiteNumberOr(explodeSpec.ms, 900);
  await Promise.all(explodeIds.map((explodeId, explodeIndex) => {
    const explodingEntry = sceneObjectsById.get(explodeId);
    if (!explodingEntry) return Promise.resolve();
    const targetPosition = explodingEntry.object.position.clone().addScaledVector(explodeGap, explodeIndex);
    return tweenObjectPlacement(explodingEntry, targetPosition, null, durationInMilliseconds);
  }));
  refreshAllBounds();
}

// A flow or force arrow: a lit tube shaft and cone head, straight
// ("from"/"to") or curved ("path"), that grows along its length.
async function runArrowCommand(arrowSpec) {
  const arrowId = uniqueObjectId(arrowSpec.id, 'arrow');
  const arrowCurve = curveFromPathPoints(Array.isArray(arrowSpec.path) ? arrowSpec.path : [arrowSpec.from, arrowSpec.to]);
  if (!arrowCurve) return;
  const curveLength = arrowCurve.getLength();
  if (!(curveLength > 0)) return;
  const shaftRadius = THREE.MathUtils.clamp(finiteNumberOr(arrowSpec.r, modelSizeSoFar() * 0.013), curveLength * 0.004, curveLength * 0.12);
  const headRadius = shaftRadius * 2.5;
  const headLength = Math.min(shaftRadius * 6.5, curveLength * 0.45);
  const shaftEndFraction = (curveLength - headLength) / curveLength;
  const shaftSamplePoints = [];
  for (let sampleIndex = 0; sampleIndex <= 24; sampleIndex++) shaftSamplePoints.push(arrowCurve.getPointAt(shaftEndFraction * sampleIndex / 24));
  const shaftCurve = new THREE.CatmullRomCurve3(shaftSamplePoints, false, 'centripetal');

  const arrowMaterial = buildPartMaterial({ mat: 'plastic', color: ARROW_COLORS[arrowSpec.color] || arrowSpec.color || ARROW_COLORS.air, roughness: 0.5 });
  const shaftMesh = new THREE.Mesh(new THREE.TubeGeometry(shaftCurve, 48, shaftRadius, 16, false), arrowMaterial);
  const headMesh = new THREE.Mesh(new THREE.CylinderGeometry(0, headRadius, headLength, 32, 1), arrowMaterial);
  const endTangent = arrowCurve.getTangentAt(1).normalize();
  headMesh.position.copy(arrowCurve.getPointAt(1)).addScaledVector(endTangent, -headLength / 2);
  headMesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), endTangent);
  const arrowGroup = new THREE.Group();
  arrowGroup.add(shaftMesh, headMesh);
  parentObjectFor(arrowSpec.in).add(arrowGroup);
  attachOutline(shaftMesh);
  attachOutline(headMesh);
  registerSceneObject(arrowId, arrowGroup, [arrowMaterial], true);

  // Grow along the length: the shaft's triangles are ordered from start to
  // end, so a growing draw range draws it like a stroke.
  const shaftIndexCount = shaftMesh.geometry.index.count;
  const indicesPerSegment = 16 * 6;
  shaftMesh.geometry.setDrawRange(0, 0);
  const finalHeadScale = headMesh.scale.clone();
  headMesh.scale.setScalar(0.0001);
  let growProgress = 0;
  const arrowTipPoint = () => projectContentPointToPage(arrowCurve.getPointAt(Math.max(0.001, growProgress * shaftEndFraction)));
  setPenTarget(arrowTipPoint, false);
  await waitMilliseconds(120);
  setPenTarget(arrowTipPoint, true);
  await animateOverDuration(THREE.MathUtils.clamp(finiteNumberOr(arrowSpec.ms, 500), 200, 1500), (progress) => {
    growProgress = easeInOutCubic(progress);
    shaftMesh.geometry.setDrawRange(0, Math.ceil(growProgress * shaftIndexCount / indicesPerSegment) * indicesPerSegment);
  });
  shaftMesh.geometry.setDrawRange(0, Infinity);
  await animateOverDuration(200, (progress) => {
    const headScale = Math.max(0.0001, easeOutBack(progress));
    headMesh.scale.set(finalHeadScale.x * headScale, finalHeadScale.y * headScale, finalHeadScale.z * headScale);
  });
  headMesh.scale.copy(finalHeadScale);
  setPenTarget(penState.targetProvider, false);
}

// A pin header in one line: "count" pins per row, "rows" rows, "pitch"
// apart, standing "len" tall on a black plastic housing. "pos" is the
// center of its footprint on the surface ("sit" puts it on a part).
async function runPinsCommand(pinsSpec) {
  const pinsId = uniqueObjectId(pinsSpec.id, 'pins');
  const pinCount = THREE.MathUtils.clamp(Math.round(finiteNumberOr(pinsSpec.count, 20)), 1, 60);
  const rowCount = THREE.MathUtils.clamp(Math.round(finiteNumberOr(pinsSpec.rows, 1)), 1, 4);
  const pinPitch = Math.max(0.01, finiteNumberOr(pinsSpec.pitch, 2.54));
  const pinLength = Math.max(0.01, finiteNumberOr(pinsSpec.len, pinPitch * 3.4));
  const pinWidth = pinPitch * 0.25;
  const housingHeight = pinPitch;
  const isAlongZ = pinsSpec.axis === 'z';
  const [footprintX, , footprintZ] = vector3Or(pinsSpec.pos, [0, 0, 0]);
  await runGroupCommand({ id: pinsId, pos: [footprintX, surfaceHeightFor(pinsSpec), footprintZ], rot: [0, isAlongZ ? 90 : 0, 0], in: pinsSpec.in });
  if (pinsSpec.housing !== false) {
    await runPartCommand({
      id: `${pinsId}_housing`, in: pinsId, shape: 'box', size: [pinCount * pinPitch, housingHeight, rowCount * pinPitch],
      pos: [0, housingHeight / 2, 0], mat: 'chip', color: '#202629', radius: pinPitch * 0.08,
    });
  }
  await runArrayCommand({
    id: `${pinsId}_pins`, in: pinsId,
    of: { shape: 'box', size: [pinWidth, pinLength, pinWidth], pos: [-(pinCount - 1) / 2 * pinPitch, pinLength / 2, -(rowCount - 1) / 2 * pinPitch], mat: 'gold', radius: pinWidth * 0.15, chamfer: true },
    count: pinCount, step: [pinPitch, 0, 0], count2: rowCount, step2: [0, 0, pinPitch],
  });
}

// Standard connectors at their real size (millimeters), built facing +x
// with the origin at the bottom center of the footprint. Each piece is
// [size, center, material, color, corner radius].
const PORT_LIBRARY = {
  'usb-a2': [
    [[17.5, 16, 14.5], [0, 8, 0], 'steel', null, 0.5],
    [[0.4, 5.6, 12.4], [8.85, 4.4, 0], 'cavity', null, 0.3], [[0.5, 1.8, 11], [8.95, 3.7, 0], 'plastic', '#f1f0ea', 0.2],
    [[0.4, 5.6, 12.4], [8.85, 11.6, 0], 'cavity', null, 0.3], [[0.5, 1.8, 11], [8.95, 10.9, 0], 'plastic', '#f1f0ea', 0.2],
  ],
  'usb3-2': [
    [[17.5, 16, 14.5], [0, 8, 0], 'steel', null, 0.5],
    [[0.4, 5.6, 12.4], [8.85, 4.4, 0], 'cavity', null, 0.3], [[0.5, 1.8, 11], [8.95, 3.7, 0], 'plastic', '#2f6fd6', 0.2],
    [[0.4, 5.6, 12.4], [8.85, 11.6, 0], 'cavity', null, 0.3], [[0.5, 1.8, 11], [8.95, 10.9, 0], 'plastic', '#2f6fd6', 0.2],
  ],
  'usb-a': [
    [[14, 7, 13.2], [0, 3.5, 0], 'steel', null, 0.4],
    [[0.4, 5.2, 12], [7.05, 3.5, 0], 'cavity', null, 0.3], [[0.5, 1.8, 10.5], [7.15, 2.8, 0], 'plastic', '#f1f0ea', 0.2],
  ],
  rj45: [
    [[21, 13.5, 16], [0, 6.75, 0], 'steel', null, 0.6],
    [[0.4, 8, 11.6], [10.55, 6.2, 0], 'cavity', null, 0.4],
    // The jack's gold contact fingers along the top of the opening, and its two LEDs.
    [[0.3, 0.8, 7.6], [10.7, 9.4, 0], 'gold', '#d9a441', 0.1],
    [[0.3, 1.2, 1.6], [10.7, 12.2, -6], 'glow', '#f2b134', 0.2], [[0.3, 1.2, 1.6], [10.7, 12.2, 6], 'glow', '#7fd16a', 0.2],
  ],
  'usb-c': [
    [[7.4, 3.2, 9], [0, 1.6, 0], 'steel', null, 1.5],
    [[0.4, 2.1, 7.6], [3.75, 1.6, 0], 'cavity', null, 1],
  ],
  'hdmi-micro': [
    [[7.5, 3.4, 6.6], [0, 1.7, 0], 'steel', null, 0.4],
    [[0.4, 2.1, 5.6], [3.8, 1.8, 0], 'cavity', null, 0.3],
  ],
  hdmi: [
    [[11.5, 6, 15], [0, 3, 0], 'steel', null, 0.5],
    [[0.4, 4.2, 13.2], [5.8, 3.1, 0], 'cavity', null, 0.4],
  ],
  // A flat-flex (camera/display) connector: beige body, black latch bar.
  ffc: [
    [[4.4, 2.4, 16.5], [0, 1.2, 0], 'plastic', '#d8d0bc', 0.25],
    [[1.5, 0.9, 17.2], [-1.1, 2.8, 0], 'plastic', '#232528', 0.2],
    [[0.3, 0.7, 14.5], [2.25, 1.5, 0], 'cavity', null, 0.1],
  ],
  microsd: [
    [[11.5, 1.6, 12], [0, 0.8, 0], 'steel', null, 0.3],
  ],
  audio: [
    [[12, 5, 6], [0, 2.5, 0], 'chip', '#2b2d31', 0.5],
  ],
};
const PORT_FACING_ROTATIONS = { '+x': 0, '-x': 180, '+z': -90, '-z': 90 };

async function runPortCommand(portSpec) {
  const portPieces = PORT_LIBRARY[portSpec.kind];
  if (!portPieces) return;
  const portId = uniqueObjectId(portSpec.id, 'port');
  const [footprintX, , footprintZ] = vector3Or(portSpec.pos, [0, 0, 0]);
  const facingRotation = PORT_FACING_ROTATIONS[portSpec.facing] === undefined ? 0 : PORT_FACING_ROTATIONS[portSpec.facing];
  await runGroupCommand({ id: portId, pos: [footprintX, surfaceHeightFor(portSpec), footprintZ], rot: [0, facingRotation, 0], in: portSpec.in });
  const portGroup = sceneObjectsById.get(portId).object;
  for (const [pieceIndex, [pieceSize, pieceCenter, pieceMaterial, pieceColor, pieceRadius]] of portPieces.entries()) {
    const pieceSpec = { in: portId, shape: 'box', size: pieceSize, pos: pieceCenter, mat: pieceMaterial, radius: pieceRadius };
    if (pieceColor) pieceSpec.color = pieceColor;
    if (portSpec.color && pieceIndex === 0) pieceSpec.color = portSpec.color;
    // The openings sit flush in the shell face: no outline of their own.
    if (pieceMaterial === 'cavity') pieceSpec.outline = false;
    const pieceId = `${portId}_${pieceIndex}`;
    const { partMesh, partMaterial } = addPartWithoutReveal(pieceSpec, pieceId);
    registerSceneObject(pieceId, partMesh, [partMaterial]);
  }
  // The whole connector pops in at once.
  await revealObjectWithPen(portGroup, boundsInContentSpace(portGroup), 520);
}

// {"t":"smd","id":"smd1","rect":[x0,z0,x1,z1],"sit":"board","count":24,"seed":3}:
// the small parts that cover a real board (resistors, capacitors, little
// chips), scattered in that footprint rectangle. Seeded, so the same line
// always gives the same layout. Sizes are millimeters.
const SMD_PART_KINDS = [
  { size: [1.0, 0.45, 0.5], mat: 'ceramic', color: '#c9b48a', weight: 4 },
  { size: [1.6, 0.55, 0.8], mat: 'ceramic', color: '#b9a27a', weight: 3 },
  { size: [1.6, 0.55, 0.8], mat: 'chip', color: '#2b2d31', weight: 2 },
  { size: [2.2, 0.9, 1.3], mat: 'chip', color: '#2b2d31', weight: 1 },
  { size: [3.2, 0.8, 3.2], mat: 'chip', color: '#26282c', weight: 1 },
];
async function runSmdCommand(smdSpec) {
  const smdId = uniqueObjectId(smdSpec.id, 'smd');
  const footprint = Array.isArray(smdSpec.rect) ? smdSpec.rect.slice(0, 4).map((value) => finiteNumberOr(value, 0)) : [-10, -10, 10, 10];
  if (footprint.length !== 4) return;
  const partCount = THREE.MathUtils.clamp(Math.round(finiteNumberOr(smdSpec.count, 24)), 1, 80);
  const sizeScale = THREE.MathUtils.clamp(finiteNumberOr(smdSpec.scale, 1), 0.1, 10);
  // mulberry32: a tiny seeded random generator.
  let randomState = (Math.round(finiteNumberOr(smdSpec.seed, 1)) >>> 0) || 1;
  const seededRandom = () => {
    randomState = (randomState + 0x6D2B79F5) >>> 0;
    let mixed = Math.imul(randomState ^ (randomState >>> 15), randomState | 1);
    mixed ^= mixed + Math.imul(mixed ^ (mixed >>> 7), mixed | 61);
    return ((mixed ^ (mixed >>> 14)) >>> 0) / 4294967296;
  };
  const totalWeight = SMD_PART_KINDS.reduce((weightSum, partKind) => weightSum + partKind.weight, 0);
  const pickPartKind = () => {
    let remainingWeight = seededRandom() * totalWeight;
    return SMD_PART_KINDS.find((partKind) => (remainingWeight -= partKind.weight) < 0) || SMD_PART_KINDS[0];
  };

  const smdGroup = new THREE.Group();
  smdGroup.position.set(0, surfaceHeightFor(smdSpec), 0);
  parentObjectFor(smdSpec.in).add(smdGroup);
  const materialByKind = new Map();
  for (let partIndex = 0; partIndex < partCount; partIndex++) {
    const partKind = pickPartKind();
    if (!materialByKind.has(partKind)) materialByKind.set(partKind, buildPartMaterial({ mat: partKind.mat, color: partKind.color }));
    const [partWidth, partHeight, partDepth] = partKind.size.map((dimension) => dimension * sizeScale);
    const smdMesh = new THREE.Mesh(buildPartGeometry({ shape: 'box', size: [partWidth, partHeight, partDepth], radius: Math.min(partWidth, partDepth) * 0.08 }), materialByKind.get(partKind));
    smdMesh.position.set(
      THREE.MathUtils.lerp(footprint[0], footprint[2], seededRandom()),
      partHeight / 2,
      THREE.MathUtils.lerp(footprint[1], footprint[3], seededRandom()),
    );
    if (seededRandom() < 0.5) smdMesh.rotation.y = Math.PI / 2;
    smdGroup.add(smdMesh);
    const outlineWidth = outlineWidthForPart(smdMesh, {});
    if (outlineWidth > 0) attachOutline(smdMesh, outlineWidth);
  }
  const smdBounds = registerSceneObject(smdId, smdGroup, Array.from(materialByKind.values()));
  await revealObjectWithPen(smdGroup, smdBounds, 420);
}

async function runCommand(command) {
  switch (command.t) {
    case 'smd': return runSmdCommand(command);
    case 'part': return runPartCommand(command);
    case 'group': return runGroupCommand(command);
    case 'array': return runArrayCommand(command);
    case 'pins': return runPinsCommand(command);
    case 'port': return runPortCommand(command);
    case 'arrow': return runArrowCommand(command);
    case 'cutaway': return runCutawayCommand(command);
    case 'label': return runLabelCommand(command);
    case 'focus': return runFocusCommand(command);
    case 'highlight': return runHighlightCommand(command);
    case 'fade': return runFadeCommand(command);
    case 'spin': return runSpinCommand(command);
    case 'move': return runMoveCommand(command);
    case 'explode': return runExplodeCommand(command);
    case 'camera': return runCameraCommand(command);
    case 'anchor': return runAnchorCommand(command);
    default: return undefined; // title and unknown commands draw nothing
  }
}

// Commands play one after another so the pen only ever draws one thing.
// When a backlog builds up (a step's lines arrive together) it speeds up so
// the drawing keeps pace with the narration.
const pendingCommands = [];
let isProcessingCommands = false;

async function processPendingCommands() {
  if (isProcessingCommands) return;
  isProcessingCommands = true;
  while (pendingCommands.length) {
    animationSpeedMultiplier = pendingCommands.length > 8 ? 2.6 : pendingCommands.length > 3 ? 1.6 : 1;
    const nextCommand = pendingCommands.shift();
    try {
      await runCommand(nextCommand);
    } catch (commandError) {
      console.error('model3d command failed', commandError);
    }
  }
  isProcessingCommands = false;
  pencilScratchSound.setDrawing(false);
  penState.isDrawing = false;
  penState.lastActiveTime = performance.now();
}

// ---------------------------------------------------------------------------
// Hit regions: the window is click-through except over the model and its
// labels, so Swift needs to know where those are.
// ---------------------------------------------------------------------------

let lastPostedHitRegionsKey = '';
let lastHitRegionsPostTime = 0;
let isPointerHovering = false;

function postHitRegions(modelRectangle, now) {
  if (now - lastHitRegionsPostTime < 120) return;
  const hitRectangles = [];
  if (modelRectangle) {
    hitRectangles.push([modelRectangle.left - 8, modelRectangle.top - 8, modelRectangle.right - modelRectangle.left + 16, modelRectangle.bottom - modelRectangle.top + 16]);
  }
  for (const calloutLabel of calloutLabels) {
    if (calloutLabel.isVisible && calloutLabel.currentLeft !== null) {
      hitRectangles.push([calloutLabel.currentLeft, calloutLabel.currentTop, calloutLabel.tagWidth, calloutLabel.tagHeight]);
    }
  }
  const roundedRectangles = hitRectangles.map((hitRectangle) => hitRectangle.map((value) => Math.round(value)));
  const hitRegionsKey = JSON.stringify(roundedRectangles);
  if (hitRegionsKey === lastPostedHitRegionsKey) return;
  lastPostedHitRegionsKey = hitRegionsKey;
  lastHitRegionsPostTime = now;
  postToHost({ kind: 'hitRegions', rects: roundedRectangles });
}

function postToHost(message) {
  try { window.webkit.messageHandlers.model3D.postMessage(message); } catch (postError) { /* no host (harness) */ }
}

// In the app, bhai's own cursor does the drawing: the page reports the pen
// tip and keeps its own triangle hidden. The harness still shows it.
const isHostDrawingPen = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.model3D);
let lastReportedPen = null;
function reportPenToHost(penX, penY) {
  if (!isHostDrawingPen) return;
  if (penX === null) {
    if (lastReportedPen === null) return;
    lastReportedPen = null;
    postToHost({ kind: 'pen', hidden: true });
    return;
  }
  if (lastReportedPen && Math.abs(lastReportedPen[0] - penX) < 0.5 && Math.abs(lastReportedPen[1] - penY) < 0.5) return;
  lastReportedPen = [penX, penY];
  postToHost({ kind: 'pen', x: penX, y: penY });
}

closeButtonElement.addEventListener('click', () => postToHost({ kind: 'close' }));

function updateCloseButton(modelRectangle) {
  closeButtonElement.classList.toggle('is-visible', isPointerHovering && !!modelRectangle);
  if (!modelRectangle) return;
  const buttonLeft = THREE.MathUtils.clamp(modelRectangle.right - 4, 4, viewportWidth - 26);
  const buttonTop = THREE.MathUtils.clamp(modelRectangle.top - 4, 4, viewportHeight - 26);
  closeButtonElement.style.transform = `translate(${buttonLeft}px, ${buttonTop}px)`;
}

// ---------------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------------

// Parts that are small on screen (a lens, a chip seen from afar) get a 1px
// outline so they stay crisp; the rest keep their own width.
const SMALL_ON_SCREEN_PART_SIZE_IN_PIXELS = 40;
function updateOutlineWidthsForScreenSize() {
  modelContent.traverse((childObject) => {
    const outlineMesh = childObject.userData.outlineMesh;
    if (!outlineMesh || !childObject.isMesh) return;
    if (!childObject.geometry.boundingSphere) childObject.geometry.computeBoundingSphere();
    const projectedSizeInPixels = 2 * childObject.geometry.boundingSphere.radius * childObject.matrixWorld.getMaxScaleOnAxis() * pixelsPerContentUnit;
    const baseOutlineWidth = outlineMesh.userData.baseOutlineWidth;
    outlineMesh.material.uniforms.outlineWidthInPixels.value = projectedSizeInPixels < SMALL_ON_SCREEN_PART_SIZE_IN_PIXELS ? Math.min(baseOutlineWidth, 1) : baseOutlineWidth;
  });
}

// The full view transform (projection x camera x model placement); when it
// changes, the picture and everything projected from it must update.
const viewSignatureMatrix = new THREE.Matrix4();
const previousViewSignature = new Array(16).fill(NaN);
let viewVersion = 0;
function updateViewVersion() {
  viewSignatureMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse).multiply(modelContent.matrixWorld);
  const signatureElements = viewSignatureMatrix.elements;
  let hasChanged = false;
  for (let elementIndex = 0; elementIndex < 16; elementIndex++) {
    if (!(Math.abs(signatureElements[elementIndex] - previousViewSignature[elementIndex]) <= 1e-7 * (1 + Math.abs(signatureElements[elementIndex])))) {
      hasChanged = true;
      previousViewSignature[elementIndex] = signatureElements[elementIndex];
    }
  }
  if (hasChanged) viewVersion += 1;
  return hasChanged;
}

function resizeRendererToWindow() {
  viewportWidth = Math.max(1, window.innerWidth);
  viewportHeight = Math.max(1, window.innerHeight);
  // The overlay spans the whole display: on a big external screen a 2x
  // buffer is several times the fill work, so it renders at 1.5x there.
  const isLargeViewport = viewportWidth * viewportHeight > 2000000;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, isLargeViewport ? 1.5 : 2));
  renderer.setSize(viewportWidth, viewportHeight, false);
  camera.aspect = viewportWidth / viewportHeight;
  camera.updateProjectionMatrix();
  renderer.getDrawingBufferSize(outlineViewportSize);
  outlineViewportSize.divideScalar(renderer.getPixelRatio());
  framesToRenderRegardless = 2;
}
let framesToRenderRegardless = 2;
window.addEventListener('resize', resizeRendererToWindow);
resizeRendererToWindow();

let previousFrameTime = performance.now();
// Render on demand: the WebGL pass (outlines, stencil caps) runs only while
// something changes, plus a couple of frames after to land the last state
// (framesToRenderRegardless, declared with the resize handler).
let renderedFrameCount = 0;
let lastRenderedBoundsVersion = -1;
function renderFrame(now) {
  const secondsSinceLastFrame = Math.min(0.1, (now - previousFrameTime) / 1000);
  previousFrameTime = now;
  advanceTweens(now);
  updateView(now, secondsSinceLastFrame);
  updateHighlightsAndSpins(now, secondsSinceLastFrame);
  modelRoot.updateMatrixWorld(true);
  camera.updateMatrixWorld();
  const hasViewChanged = updateViewVersion();
  const isSceneChanging = hasViewChanged || isProcessingCommands || activeTweens.size > 0 || spinningObjects.length > 0
    || highlightPulses.length > 0 || lastRenderedBoundsVersion !== boundsVersion;
  if (isSceneChanging) framesToRenderRegardless = Math.max(framesToRenderRegardless, 2);
  if (framesToRenderRegardless > 0) {
    framesToRenderRegardless -= 1;
    lastRenderedBoundsVersion = boundsVersion;
    for (const cutaway of activeCutaways) {
      positionCutawayCaps(cutaway);
      cutaway.worldPlane.copy(cutaway.localPlane).applyMatrix4(modelContent.matrixWorld);
    }
    // Every 10th frame, and on the last frame before rendering pauses.
    if (renderedFrameCount % 10 === 0 || framesToRenderRegardless === 0) updateOutlineWidthsForScreenSize();
    renderedFrameCount += 1;
    renderer.render(scene, camera);
  }

  const modelRectangle = projectedBoundsRectangle(null, cornersOfAllParts());
  correctFitTowardRectangle(modelRectangle);
  updateCalloutLabels(modelRectangle);
  updatePenCursor(now);
  updateCloseButton(modelRectangle);
  postHitRegions(modelRectangle, now);
  requestAnimationFrame(renderFrame);
}
requestAnimationFrame(renderFrame);

// ---------------------------------------------------------------------------
// API called from Swift (arguments are JSON strings / booleans, never code)
// ---------------------------------------------------------------------------

window.hb = {
  add(commandLine) {
    let parsedCommand;
    try { parsedCommand = JSON.parse(commandLine); } catch (parseError) { return; }
    if (!parsedCommand || typeof parsedCommand !== 'object' || Array.isArray(parsedCommand)) return;
    pendingCommands.push(parsedCommand);
    processPendingCommands();
  },
  done() {},
  // The overlay covers the whole display: the screenshot's size (so anchor
  // boxes in screenshot pixels map onto the page) and where the model goes
  // when no anchor arrives (screenshot pixels too). Numbers only.
  configure(screenshotWidth, screenshotHeight, focusX, focusY) {
    const width = finiteNumberOr(screenshotWidth, 0), height = finiteNumberOr(screenshotHeight, 0);
    if (width > 0 && height > 0) screenshotSizeInPixels = { width, height };
    if (Number.isFinite(Number(focusX)) && Number.isFinite(Number(focusY)) && screenshotSizeInPixels) {
      defaultFocusPagePoint = {
        x: Number(focusX) * viewportWidth / screenshotSizeInPixels.width,
        y: Number(focusY) * viewportHeight / screenshotSizeInPixels.height,
      };
    }
  },
  setHover(isHovering) { isPointerHovering = !!isHovering; },
  isBusy() { return isProcessingCommands || pendingCommands.length > 0; },
};
</script>
</body>
</html>
