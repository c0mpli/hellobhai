name: tauri
on:
  push:
    paths: ["tauri/**", ".github/workflows/tauri.yml"]
  pull_request:
    paths: ["tauri/**", ".github/workflows/tauri.yml"]
  workflow_dispatch:

jobs:
  windows-test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --locked
        working-directory: tauri/src-tauri
      - run: npm ci
      # whisper-server.exe and onnxruntime.dll need the Visual C++ runtime, which a
      # clean Windows lacks. Ship app-local copies next to hellobhai.exe (Microsoft's
      # supported app-local deployment); whisper-server finds them through PATH.
      - name: Copy the Visual C++ runtime DLLs
        shell: pwsh
        run: |
          $visualStudioPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $runtimeFolder = Get-ChildItem "$visualStudioPath\VC\Redist\MSVC\*\x64\Microsoft.VC14*.CRT" | Sort-Object FullName | Select-Object -Last 1
          New-Item -ItemType Directory -Force src-tauri/vc-runtime | Out-Null
          foreach ($dllName in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item (Join-Path $runtimeFolder.FullName $dllName) src-tauri/vc-runtime/
          }
      - run: npx tauri build --bundles nsis --config src-tauri/tauri.vc-runtime.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: hellobhai-windows-installer
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
