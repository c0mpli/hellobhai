name: tauri
on:
  push:
    paths: ["tauri/**", ".github/workflows/tauri.yml"]
  pull_request:
    paths: ["tauri/**", ".github/workflows/tauri.yml"]
  workflow_dispatch:

jobs:
  windows-test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo test --locked
        working-directory: tauri/src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: hellobhai-windows-installer
          path: tauri/src-tauri/target/release/bundle/nsis/*.exe
