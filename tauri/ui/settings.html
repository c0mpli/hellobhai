<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src ipc: http://ipc.localhost">
<title>hellobhai</title>
<link rel="stylesheet" href="settings.css">
</head>
<body>
<!-- Tray settings panel, the Windows counterpart of the Mac's CompanionPanelView. -->
<main class="settings-panel" id="settings-panel">
  <header class="panel-header">
    <span class="status-dot" id="status-dot"></span>
    <h1>bhai</h1>
    <span class="header-status-text" id="status-line">Ready</span>
    <button class="close-button" id="close-button" type="button" title="Close" aria-label="Close">
      <svg viewBox="0 0 10 10" width="9" height="9" aria-hidden="true"><path d="M1 1 9 9M9 1 1 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </header>

  <section class="push-to-talk-hint" id="push-to-talk-hint">
    <span>Hold</span><span class="key-capsules" id="hint-key-capsules"></span><span>to talk.</span>
  </section>

  <div class="divider"></div>

  <section class="settings-section">
    <h2 class="section-label">Claude</h2>
    <div class="settings-row">
      <span class="row-label">Model</span>
      <div class="segmented-control" id="claude-model-picker" role="radiogroup" aria-label="Claude model"></div>
    </div>
    <div class="settings-row">
      <span class="row-label">claude CLI</span>
      <span class="status-label" id="claude-status"></span>
    </div>
  </section>

  <section class="settings-section">
    <h2 class="section-label">Voice</h2>
    <div class="settings-row">
      <span class="row-label">Voice</span>
      <div class="row-controls">
        <select class="menu-picker" id="voice-picker" aria-label="Voice"></select>
        <button class="preview-button" id="preview-voice-button" type="button" title="Preview voice" aria-label="Preview voice">
          <svg viewBox="0 0 10 10" width="8" height="8" aria-hidden="true"><path d="M2 1 9 5 2 9Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
    <div class="settings-row">
      <span class="row-label">Speech output</span>
      <span class="status-label" id="voice-status"></span>
    </div>
    <div class="settings-row">
      <span class="row-label">Speech input</span>
      <span class="status-label" id="speech-model-status"></span>
    </div>
  </section>

  <section class="settings-section">
    <h2 class="section-label">Shortcut</h2>
    <div class="settings-row">
      <span class="row-label">Push to talk</span>
      <select class="menu-picker" id="shortcut-picker" aria-label="Push-to-talk shortcut"></select>
    </div>
  </section>

  <section class="settings-section">
    <h2 class="section-label">Permissions</h2>
    <div class="settings-row">
      <span class="row-label">Microphone</span>
      <div class="row-controls">
        <span class="status-label" id="microphone-status"></span>
        <button class="pill-button" id="open-microphone-settings-button" type="button">Open settings</button>
      </div>
    </div>
  </section>

  <section class="settings-section">
    <h2 class="section-label">General</h2>
    <label class="settings-row clickable-row" for="launch-at-login-toggle">
      <span class="row-label">Launch at login</span>
      <input class="toggle" id="launch-at-login-toggle" type="checkbox" role="switch">
    </label>
    <button class="settings-row clickable-row row-button" id="replay-onboarding-button" type="button">
      <span class="row-label">Replay onboarding</span>
    </button>
  </section>

  <div class="divider"></div>

  <footer class="panel-footer">
    <button class="quit-button" id="quit-button" type="button">Quit hellobhai</button>
    <span class="version-label" id="version-label"></span>
  </footer>
</main>
<script src="settings.js"></script>
</body>
</html>
